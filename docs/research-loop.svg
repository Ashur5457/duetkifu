<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-labelledby="t d">
  <title id="t">The Duetkifu research loop</title>
  <desc id="d">Every attempt is a move. Open a move with the move it follows and why. Compute with scripts that are recorded, so every number can be recomputed from the raw files. Close the move with its result; a dead end says why, and whether the idea was wrong or the data cannot be trusted. You decide on the tree: the result, the cause, marks; text the agent wrote is marked until you look at it. Tell the finished story in the report, whose chapters name their moves, then open the next move. Every number says where it comes from: recomputed, sourced, or no data with a reason.</desc>
  <style>
    .bg{fill:#ffffff}
    .box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
    .you{fill:#e8f1f8;stroke:#1f6f8b;stroke-width:1.5}
    .agent{fill:#f1ecf8;stroke:#6b4fa0;stroke-width:1.5}
    .both{fill:#eef4ee;stroke:#2e7d4f;stroke-width:1.5}
    .h{font:700 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1f2328}
    .t{font:400 13.5px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#424a53}
    .n{font:700 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#ffffff}
    .who{font:600 12px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.04em}
    .wy,.dy{fill:#1f6f8b}.wa,.da{fill:#6b4fa0}.wb,.db{fill:#2e7d4f}
    .ar{fill:none;stroke:#8c959f;stroke-width:2}
    .ah{fill:#8c959f}
    .ok{fill:#2e7d4f}.ring{fill:#ffffff;stroke:#2e7d4f;stroke-width:2}.none{fill:none;stroke:#8c959f;stroke-width:1.5;stroke-dasharray:3 2}
    .dead{fill:#ffffff;stroke:#8c959f;stroke-width:1.6}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0d1117}
      .box{fill:#161b22;stroke:#30363d}
      .you{fill:#0f2a36;stroke:#5db7d4}
      .agent{fill:#241c33;stroke:#a98be0}
      .both{fill:#12261a;stroke:#6cc38a}
      .h{fill:#e6edf3}.t{fill:#9da7b3}
      .wy,.dy{fill:#5db7d4}.wa,.da{fill:#a98be0}.wb,.db{fill:#6cc38a}
      .ar{stroke:#6e7681}.ah{fill:#6e7681}
      .ok{fill:#6cc38a}.ring{fill:#0d1117;stroke:#6cc38a}.none{stroke:#6e7681}.dead{fill:#0d1117;stroke:#9da7b3}
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10Z"/></marker></defs>
  <rect class="bg" width="900" height="390" rx="12"/>

  <!-- 1 open -->
  <rect class="both" x="24" y="40" width="250" height="120" rx="10"/>
  <circle class="db" cx="48" cy="66" r="12"/><text class="n" x="48" y="70.5" text-anchor="middle">1</text>
  <text class="who wb" x="68" y="70">YOU OR THE AGENT</text>
  <text class="h" x="40" y="100">Open a move</text>
  <text class="t" x="40" y="122">the move it follows, and why;</text>
  <text class="t" x="40" y="141">options not tried stay as planned</text>

  <!-- 2 compute -->
  <rect class="agent" x="324" y="40" width="250" height="120" rx="10"/>
  <circle class="da" cx="348" cy="66" r="12"/><text class="n" x="348" y="70.5" text-anchor="middle">2</text>
  <text class="who wa" x="368" y="70">AGENT</text>
  <text class="h" x="340" y="100">Compute, recorded</text>
  <text class="t" x="340" y="122">every script run is a step;</text>
  <text class="t" x="340" y="141">every file has a fingerprint</text>

  <!-- 3 close -->
  <rect class="agent" x="624" y="40" width="252" height="120" rx="10"/>
  <circle class="da" cx="648" cy="66" r="12"/><text class="n" x="648" y="70.5" text-anchor="middle">3</text>
  <text class="who wa" x="668" y="70">AGENT</text>
  <text class="h" x="640" y="100">Close it, dead ends too</text>
  <text class="t" x="640" y="122">result; a dead end says why:</text>
  <text class="t" x="640" y="141">wrong idea, or untrusted data?</text>

  <!-- 4 decide -->
  <rect class="you" x="624" y="214" width="252" height="120" rx="10"/>
  <circle class="dy" cx="648" cy="240" r="12"/><text class="n" x="648" y="244.5" text-anchor="middle">4</text>
  <text class="who wy" x="668" y="244">YOU</text>
  <text class="h" x="640" y="274">Decide on the tree</text>
  <text class="t" x="640" y="296">result, cause, marks; the agent's</text>
  <text class="t" x="640" y="315">text is marked until you look</text>

  <!-- 5 tell -->
  <rect class="you" x="324" y="214" width="250" height="120" rx="10"/>
  <circle class="dy" cx="348" cy="240" r="12"/><text class="n" x="348" y="244.5" text-anchor="middle">5</text>
  <text class="who wy" x="368" y="244">YOU AND THE AGENT</text>
  <text class="h" x="340" y="274">Tell it in the report</text>
  <text class="t" x="340" y="296">chapters name their moves;</text>
  <text class="t" x="340" y="315">review, comment, revise</text>

  <!-- arrows -->
  <path class="ar" d="M276,100H320" marker-end="url(#a)"/>
  <path class="ar" d="M576,100H620" marker-end="url(#a)"/>
  <path class="ar" d="M750,162V210" marker-end="url(#a)"/>
  <path class="ar" d="M622,274H578" marker-end="url(#a)"/>
  <path class="ar" d="M322,274H200V164" marker-end="url(#a)"/>
  <text class="t" x="210" y="195">next move</text>

  <!-- where the numbers come from -->
  <rect class="box" x="24" y="214" width="150" height="120" rx="10"/>
  <text class="h" x="38" y="240" style="font-size:15px">Every number</text>
  <text class="h" x="38" y="258" style="font-size:15px">says where from</text>
  <circle class="ok" cx="44" cy="282" r="5.5"/><text class="t" x="56" y="286">recomputed</text>
  <circle class="ring" cx="44" cy="302" r="5"/><text class="t" x="56" y="306">sourced</text>
  <circle class="none" cx="44" cy="322" r="5"/><text class="t" x="56" y="326">no data, why</text>

  <text class="t" x="24" y="372">kifu.json keeps every move; report.json tells a few of them. Both are plain JSON in your folder.</text>
</svg>
