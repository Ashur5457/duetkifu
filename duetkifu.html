<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duetkifu</title>
<link id="fontlink" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
<style>
:root{
  --bg:#E9EEF1;--paper:#FFFFFF;--ink:#13232C;--muted:#5A6B75;--line:#D2DBE0;--soft:#F3F6F8;
  --accent:#1F6F8B;--accent-ink:#FFFFFF;
  --mark:#D6336C;--mark-fill:rgba(214,51,108,.12);
  --hl:#FFCF33;--hl-fill:rgba(255,207,51,.30);--hl-stroke:#B98A00;
  --ok:#2E7D4F;--ok-fill:rgba(46,125,79,.10);
  --c0:#7D8D99;--c1:#1F6F8B;--c2:#D9781A;--c3:#6B4FA0;--c4:#2E7D4F;--c5:#B83B5E;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C171D;--paper:#15242C;--ink:#E4EDF1;--muted:#93A6B1;--line:#2A3E49;--soft:#1B2C35;
  --accent:#5DB7D4;--accent-ink:#0C171D;
  --mark:#FF6B9A;--mark-fill:rgba(255,107,154,.16);
  --hl:#FFD84D;--hl-fill:rgba(255,216,77,.24);--hl-stroke:#FFD84D;
  --ok:#6CC38A;--ok-fill:rgba(108,195,138,.14);
  --c0:#A3B3BF;--c1:#5DB7D4;--c2:#F2A340;--c3:#A98BE0;--c4:#6CC38A;--c5:#F07A9C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C171D;--paper:#15242C;--ink:#E4EDF1;--muted:#93A6B1;--line:#2A3E49;--soft:#1B2C35;
  --accent:#5DB7D4;--accent-ink:#0C171D;
  --mark:#FF6B9A;--mark-fill:rgba(255,107,154,.16);
  --hl:#FFD84D;--hl-fill:rgba(255,216,77,.24);--hl-stroke:#FFD84D;
  --ok:#6CC38A;--ok-fill:rgba(108,195,138,.14);
  --c0:#A3B3BF;--c1:#5DB7D4;--c2:#F2A340;--c3:#A98BE0;--c4:#6CC38A;--c5:#F07A9C;
  color-scheme:dark}
/* font stacks per interface language; Latin glyphs come first, CJK fonts fill in the rest */
:root{--sans:'Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--serif:'Noto Serif',Georgia,'Times New Roman',serif}
:root:lang(zh-Hant){--sans:'Noto Sans','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;--serif:'Noto Serif','Noto Serif TC','Songti TC','PMingLiU',serif}
:root:lang(zh-Hans){--sans:'Noto Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;--serif:'Noto Serif','Noto Serif SC','Songti SC','SimSun',serif}
:root:lang(ja){--sans:'Noto Sans','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',system-ui,sans-serif;--serif:'Noto Serif','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif}
:root:lang(ko){--sans:'Noto Sans','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;--serif:'Noto Serif','Noto Serif KR','AppleMyungjo','Batang',serif}
html,body{height:100%}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans)}
h1,h2,.btitle{font-family:var(--serif);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:1500px;margin:0 auto;padding:10px 22px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.top h1{font-size:18px;margin:0 8px 0 0;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hint{color:var(--muted);font-size:13px;flex:1 1 220px}
#agentbar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:13px}
#agentbar[hidden]{display:none}
.reply.me{border-left-color:var(--c2)}
.linkbtn.rv{font-size:12px;color:var(--muted)}
.series{margin:8px 0 4px;padding-top:6px;border-top:1px dashed var(--line)}
.srow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0;font-size:13px}
.srow .sno{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--soft);font-size:11px}
.srow select,.srow input{font:inherit;font-size:13px;max-width:210px}
.fsel{margin:0;flex:0 0 auto;align-self:center}
details.ex{margin:4px 0;font-size:12.5px}details.ex summary{cursor:pointer;color:var(--accent)}
.exrow{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline;margin:4px 0}
.excat{color:var(--muted);min-width:5em;font-size:12px}
.exs{border:1px dashed var(--line);background:var(--soft);color:var(--ink);border-radius:12px;padding:2px 9px;font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
.exs:hover{border-color:var(--accent)}
.attach{display:flex;gap:6px;align-items:baseline;font-size:12.5px;margin:4px 0}
#qc details.ex{max-height:180px;overflow:auto}
.fselbar{position:sticky;bottom:0;z-index:2;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:8px 0 0;padding:8px 10px;
  border:1px solid var(--accent);border-radius:8px;background:var(--paper);font-size:13px;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
.fselbar .sp{flex:1}
.picklist{display:flex;flex-direction:column;gap:4px;max-height:40vh;overflow:auto;margin:0 0 8px}
.langbox textarea{width:100%;box-sizing:border-box;font:inherit;font-size:13px}
.afiles{font-size:12.5px;margin:4px 0}.afiles summary{cursor:pointer;color:var(--muted)}.afiles ul{margin:4px 0;padding-left:16px;max-height:180px;overflow:auto}
.dspick{display:inline-flex;flex-direction:column;gap:3px}.dspick input{font:inherit;font-size:12.5px}
.flist li.grp{background:var(--soft);font-weight:500;padding:5px 6px}
.flist li.sub{padding-left:14px}
.ftop{margin:0 0 6px}
.wstats{margin:6px 0;font-size:13px;border-collapse:collapse}.wstats th{text-align:left;font-weight:400;color:var(--muted);padding:2px 14px 2px 0}
.wadd input{flex:1;min-width:0;font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink)}
.wrules .chk{display:flex;gap:6px;align-items:baseline;flex:1 1 60%}
.areply{display:flex;gap:6px;align-items:flex-end;margin:6px 0}
.areply textarea{flex:1;min-width:0;box-sizing:border-box;font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink)}
#agentbar .conn{display:inline-flex;gap:6px;align-items:center;font-weight:500}
#agentbar .sp{flex:1}
#agentbar .ast{font-size:13px;color:var(--muted)}
#agentbar .ast.bad{color:var(--c5)}
#agentbar .ast.ok{color:var(--ok)}
#lang{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--paper)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.langbox{max-width:560px;font-size:14px}
.langbox ol{padding-left:1.3em;margin:6px 0 12px}
.langbox ol li{margin:0 0 6px}
.langbox ul{list-style:none;padding:0;margin:6px 0}
.langbox li.cl{display:flex;gap:10px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line)}
.langbox h4{margin:14px 0 4px;font-size:13px;font-weight:500;color:var(--muted)}
.langbox li.cl .linkbtn{margin-left:auto}
.btn.issues{border-color:var(--mark);color:var(--mark);font-weight:500}
.btn.issues.warn{border-color:var(--c2);color:var(--c2)}
.issuebox{max-width:760px}
.issuelist{list-style:none;padding:0;margin:6px 0 10px;max-height:60vh;overflow:auto}
.issuelist li{border-bottom:1px solid var(--line);padding:6px 0;font-size:13px}
.issuelist .lvl{font-size:11.5px;border-radius:4px;padding:0 6px;color:#fff;background:var(--mark)}
.issuelist li.warning .lvl{background:var(--c2)}
.issuelist pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--soft);padding:6px 8px;border-radius:5px;margin:4px 0 0}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:5px 12px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{padding:2px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}

/* layout */
.wrap{max-width:1500px;margin:0 auto;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) 10px var(--sidew,380px);gap:26px 8px;align-items:start}
body.nopanel .wrap{grid-template-columns:minmax(0,1fr)}
body.nopanel .sidegrip{display:none}
body.nopanel #panel{display:none}
/* the side panel of the edit modes floats (moved by its header, resized from its corner, folded to one line) or is pinned on the right */
#panel .pnh{display:flex;align-items:center;gap:6px;margin:-8px -10px 8px;padding:4px 6px 6px;border-bottom:1px solid var(--line);font-size:13px;cursor:move;user-select:none;touch-action:none}
#panel .pnh .sp{flex:1}#panel .pnh button{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:6px;height:24px;min-width:26px;font:inherit;font-size:12px;cursor:pointer;padding:0 7px}
body:not(.pfloat) #panel .pnh{cursor:default}
body.pfloat .wrap{grid-template-columns:minmax(0,1fr)}body.pfloat .sidegrip{display:none}
body.pfloat #panel{box-sizing:border-box;position:fixed;z-index:48;right:16px;top:90px;width:380px;height:min(640px,calc(100vh - 110px));max-height:calc(100vh - 16px);min-width:260px;min-height:120px;
  max-width:calc(100vw - 16px);resize:both;box-shadow:0 6px 24px rgba(0,0,0,.14)}
body.pfloat #panel.min{height:auto!important;min-height:0;resize:none;overflow:hidden}
#panel.min>:not(.pnh){display:none}#panel.min .pnh{margin-bottom:-8px;border-bottom:0}
main{min-width:0}
#note-db{background:var(--hl-fill);border:1px solid var(--hl-stroke);border-radius:8px;padding:8px 12px;margin:0 0 14px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
#note-db.saved{background:var(--ok-fill);border-color:var(--ok)}
#note-text{flex:1 1 320px}
#note-acts{display:flex;flex-wrap:wrap;gap:6px}
.flist{list-style:none;margin:6px 0 8px;padding:0}
.flist li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.flist .fname{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;overflow-wrap:anywhere}
.flist .fstat{color:var(--muted);font-size:12px;flex:1 1 120px}
.flist .fstat.stale{color:var(--c2);font-weight:500}
.flist .btn{margin-left:auto}
/* data chain */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c0);flex:0 0 auto}
.dot.ok{background:var(--ok)}.dot.stale{background:var(--c5)}
.srcl{display:flex;align-items:center;gap:7px;margin:5px 0 0;padding:0;border:0;background:none;color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;line-height:1.45;cursor:pointer;text-align:left;max-width:100%}
.srcl .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.srcl:hover .t{text-decoration:underline}
.chain{font-size:13px;width:min(760px,86vw);line-height:1.45}
.chain .fr{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;padding:2px 0}
.chain .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;overflow-wrap:anywhere}
.chain .meta{color:var(--muted);font-size:12px}
.chain .why{color:var(--c5);margin:2px 0;padding-left:16px}
.chain details{margin:3px 0 3px 12px;padding-left:8px;border-left:2px solid var(--line)}
.chain summary{cursor:pointer;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chain .kv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:4px 0}
.chain .kv>span:nth-child(odd){color:var(--muted);font-size:12px}
.chain h5,.stsec h5{margin:10px 0 3px;font-size:12.5px;font-weight:500;color:var(--muted)}
.chain ul,.chlinks{list-style:none;margin:2px 0;padding:0}
.chain .st{font-weight:500}
.chsum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin:4px 0}
.chain .bad{color:var(--c5);font-size:12px;font-weight:500}
.chlinks li{display:flex;gap:6px;align-items:center;padding:2px 0 2px 14px}
.flist details{width:100%}.flist summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flist .dot{align-self:center}
/* the files of the folder as a tree: folders folded until opened; a box filters the names and searches inside the files */
.ftree{list-style:none;margin:6px 0 8px;padding:0}.ftree .ftree{margin:0 0 0 14px}
.ftree>li.fdir{display:block;border-bottom:0;padding:0}
.ftree details>summary{list-style:none;display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;padding:5px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.ftree details>summary::-webkit-details-marker{display:none}
.ftree details>summary::before{content:"\25B8";color:var(--muted);width:1em;display:inline-block}.ftree details[open]>summary::before{content:"\25BE"}
.fsec{margin:4px 0}.fsec>summary{list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 2px;cursor:pointer;font-size:13px}
.fsec>summary::-webkit-details-marker{display:none}.fsec>summary::before{content:"\25B8";color:var(--muted);width:1em;display:inline-block}.fsec[open]>summary::before{content:"\25BE"}
.ftree .dname,.fsec .dname{font-weight:600;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.fsearch{display:flex;gap:6px;align-items:center;margin:4px 0 8px}.fsearch input{flex:1;min-width:0;font:inherit;font-size:13px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.fhits{list-style:none;margin:4px 0 10px;padding:0}.fhits li{border-bottom:1px solid var(--line);padding:6px 2px;font-size:12.5px}
.fhits .fhp{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.fhits .fhp .mono{overflow-wrap:anywhere}.fhits .loc{color:var(--muted)}
.fhits .ex{color:var(--muted);margin-top:2px;overflow-wrap:anywhere}.fhits mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:2px}

/* page (view) */
.page{width:var(--pw);height:var(--ph);margin:0 auto;background:var(--paper);border-radius:6px;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 24px rgba(0,0,0,.08);position:relative;overflow:hidden}
.page .inner{position:absolute;inset:0;padding:var(--py) var(--px);overflow:hidden;display:flex;flex-direction:column;gap:var(--gap)}
.page.scrolls .inner{overflow:auto}
.page .pno{position:absolute;right:14px;bottom:8px;font-size:12px;color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0 10px}
.pager .cnt{min-width:96px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.thumbs button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 10px;font-size:13px;cursor:pointer;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumbs button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* block content (shared) */
.blk{position:relative;flex:0 0 auto}
.duo{display:flex;gap:calc(var(--gap) * 2);align-items:flex-start;flex:0 0 auto}
.duo>.col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.duo>.col.main{flex:3 1 0}.duo>.col.side{flex:2 1 0}
.toc{list-style:none;margin:0;padding:0}
.toc li{display:flex;align-items:baseline;gap:8px;padding:2px 0}
.toc li.l1{font-weight:500}
.toc li.l2{padding-left:1.5em;font-size:.93em}
.toc .tocl{border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-align:left}
.toc .tocl:hover{text-decoration:underline}
.toc .lead{flex:1 1 20px;border-bottom:1px dotted var(--line)}
.toc .pg{color:var(--muted);font-variant-numeric:tabular-nums}
#tree{max-width:980px}
.treeintro{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.tlane{display:flex;flex-direction:column;gap:10px}
.tbr{margin:0 0 0 22px;padding:2px 0 2px 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tnode{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--st,var(--line));border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:5px}
.tnode.st-stopped{opacity:.78}
.tnode .th{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.tnode .tt{border:0;background:none;padding:0;font:700 16px/1.35 var(--serif);color:var(--ink);cursor:pointer;text-align:left}
.tnode .tt:hover{text-decoration:underline}
.tnode .tm{color:var(--muted);font-size:13px}
.tnode .tl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13.5px}
.tnode .tl .k{color:var(--muted)}
/* the research record (kifu.json): a discovery tree */
#tree.kifu{max-width:1320px}
/* full screen: the Kifu diagram fills the window (and the screen, when the browser allows it), This move floats on the right;
   it is set on #tree, which stays when the page redraws */
#tree.kfull{position:fixed;inset:0;z-index:45;max-width:none;margin:0;background:var(--bg);padding:12px 16px;overflow:hidden}
#tree.kfull #treehost>:not(.kb-tree):not(.kb-move):not(.krow2),#tree.kfull .krow2>:not(.kb-tree):not(.kb-move),
#tree.kfull .krow2>.kgrip,#tree.kfull .kdrag,#tree.kfull .kb-tree>.kbody>.kgrip,#tree.kfull .kb-move .kgrip{display:none}
#tree.kfull .krow2{display:block;margin:0}
#tree.kfull .kb-tree .kstage{height:calc(100vh - 140px)!important}
#tree.kfull .kb-move{position:fixed;top:var(--kfstop,130px);right:20px;width:min(440px,40vw);max-height:calc(100vh - var(--kfstop,130px) - 16px);display:flex;flex-direction:column;z-index:5;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px 10px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#tree.kfull .kb-move.folded{padding:0;border:0;background:none;box-shadow:none;width:auto}
#tree.kfull .kb-move>.kbody{overflow:auto;min-height:0}
#tree.kfull .kb-move .kpanel{height:auto!important;max-height:none;border:0;padding:6px 4px}
.kq{font:700 19px/1.45 var(--serif);margin:0 0 6px;max-width:75ch}
.kstats{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.kpill{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 11px 2px 8px;font-size:12.5px;color:var(--muted)}
.kpill b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.kpl+.kpl::before{content:"/ ";color:var(--line)}
.kbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 12px;font-size:13px}
.kseg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.kseg button{border:0;border-right:1px solid var(--line);background:none;color:var(--muted);padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.kseg button:last-child{border-right:0}
.kseg button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:700}
.kchkb{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer}
.ksearch{display:inline-flex;align-items:center;gap:8px}
.ksearch input{font:inherit;font-size:13px;padding:4px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:180px}

 "The Kifu is the record of the research: every attempt is a move, and each move follows the one it was based on, from the question on the left.": "기보는 연구의 기록입니다. 시도 하나하나가 한 수이고, 각 수는 근거가 된 수 뒤에 이어집니다. 맨 왼쪽이 연구 질문입니다.",
 "Shapes.": "모양.",
 "The shape says how a move ended: a filled dot holds, a crossed circle is a dead end, a diamond corrects an earlier move, an open circle is not resolved yet. The legend above the tree lists them all.": "모양은 그 수가 어떻게 끝났는지를 나타냅니다. 채운 점＝성립, X 표시 원＝막다른 길, 마름모＝이전 수를 바로잡음, 빈 원＝아직 해결 안 됨. 트리 위 범례에 모든 모양이 있습니다.",
 "Arrows.": "화살표.",
 "Dotted and dashed arrows between moves: a clue for, corrects, supports.": "수와 수 사이의 점선·파선 화살표: 단서, 바로잡음, 뒷받침.",
 "Details.": "자세히.",
 "Click a move to see why it was made, what came out, and the files and steps its numbers come from.": "수를 클릭하면 왜 그 수를 두었는지, 결과, 숫자가 나온 파일과 계산 단계가 보입니다.",
 "Highlight.": "강조.",
 "Show only the main path, the dead ends, the moves you started, or the checks that do not match.": "주요 경로, 막다른 길, 내가 시작한 수, 대조가 맞지 않는 곳만 볼 수 있습니다.",
 "Comment.": "댓글.",
 "Under a move, write a comment and ask the agent, the same as under a block of the report.": "수 아래에 댓글을 달고 에이전트에게 요청할 수 있습니다. 보고서 블록과 같습니다.",
 "To change the record, use Kifu edit at the top.": "기보를 바꾸려면 위의 「기보 편집」을 사용하세요.",
 "Editing the Kifu": "기보 편집",
 "Most of it is done on the tree. You decide; the agent can write the text for you to check.": "대부분은 트리에서 합니다. 결정은 내가 하고, 글은 에이전트가 먼저 쓰고 내가 확인할 수 있습니다.",
 "Result.": "결과.",
 "Click a move. The small buttons beside it set the result: ✓ holds, ✗ dead end, ? no conclusion, ○ active. A dead end asks for its cause and one sentence why.": "수를 클릭하면 옆의 작은 버튼으로 결과를 정합니다: ✓ 성립, ✗ 막다른 길, ? 결론 없음, ○ 진행 중. 막다른 길은 원인과 한 문장 이유를 묻습니다.",
 "Place.": "위치.",
 "Drag a move to place it. Drop it onto another move to make it follow that move.": "수를 끌어서 배치합니다. 다른 수 위에 놓으면 그 수 다음으로 이어집니다.",
 "Arrows and new moves.": "화살표와 새 수.",
 "Drag the + under the move onto another move to draw an arrow (clue, corrects, supports); onto empty space to add the next move there. Click an arrow to change or delete it.": "수 아래의 +를 다른 수로 끌면 화살표(단서, 바로잡음, 뒷받침)를 그리고, 빈 곳으로 끌면 거기에 다음 수를 추가합니다. 화살표를 클릭하면 종류를 바꾸거나 삭제할 수 있습니다.",
 "The form on the right.": "오른쪽 양식.",
 "On top, what only you decide: title, result, cause, mark. The written part can be filled in by the agent: click \"Ask the agent to fill this in\". What the agent wrote and you have not looked at yet is marked in orange. The rest is under Advanced.": "맨 위는 나만 정할 수 있는 것: 제목, 결과, 원인, 표시. 설명 글은 에이전트가 채울 수 있습니다: 「에이전트에게 채워 달라고 하기」를 누르세요. 에이전트가 쓰고 아직 확인하지 않은 것은 주황색으로 표시됩니다. 나머지는 「고급」에 있습니다.",

const masterKeys=()=>Object.keys(I18N['zh-Hant']||{}).filter(k=>!k.startsWith('_'));
const englishOf=k=>/^[a-z]+\|/.test(k)?k.slice(k.indexOf('|')+1):k;
const placeholders=s=>[...new Set([...String(s).matchAll(/\{(\w+)\}/g)].map(m=>m[1]))].sort().join();

/* ---------- Demo data (fixed random seed, not experimental results) ---------- */
function seedData(){
  let s=20260921;const R=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const g=(m,sd)=>m+sd*Math.sqrt(-2*Math.log(1-R()))*Math.cos(2*Math.PI*R());
  const peak=(a,b)=>Math.exp(-(((a-2.6)**2)/(2*.81)+((b-1.4)**2)/(2*.49)));
  const rows=[];
  for(let i=0;i<45;i++){const cycle=Math.floor(i/15)+1;let a,b;
    if(cycle===1){a=R()*5;b=R()*5}else if(cycle===2){a=clamp(g(2.7,1),0,5);b=clamp(g(1.6,1),0,5)}else{a=clamp(g(2.6,.35),0,5);b=clamp(g(1.4,.3),0,5)}
    rows.push({id:i+1,cycle,a:+a.toFixed(2),b:+b.toFixed(2),score:+clamp(peak(a,b)*.92+g(0,.03)+.04,0,1).toFixed(3)})}
  return {id:'exp',title:tr('Demo experiment data'),columns:[
    {key:'id',label:tr('Run')},{key:'cycle',label:'Cycle'},{key:'a',label:tr('Additive A (wt%)')},{key:'b',label:tr('Additive B (wt%)')},{key:'score',label:tr('Score')}],rows};
}
function nyquistSVG(){
  let d='',pts=[];const Rs=12,Rct=38;
  for(let k=0;k<=60;k++){const w=10**(4-k*0.1);const zr=Rs+Rct/(1+(w*0.0009)**2);const zi=Rct*(w*0.0009)/(1+(w*0.0009)**2);pts.push([zr,zi])}
  for(let k=1;k<=18;k++){const z=Rs+Rct+k*2.2;pts.push([z,k*2.2+0.6*Math.sin(k)])}
  const X=v=>70+(v-0)*7.6,Y=v=>330-v*7.6;
  d=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
  const dots=pts.filter((p,i)=>i%3===0).map(p=>`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.2" fill="#1F6F8B"/>`).join('');
  let grid='';for(let v=0;v<=90;v+=10){grid+=`<line x1="${X(v)}" y1="30" x2="${X(v)}" y2="330" stroke="#dde3e6"/><text x="${X(v)}" y="350" font-size="12" text-anchor="middle" fill="#5a6b75">${v}</text>`}
  for(let v=0;v<=40;v+=10){grid+=`<line x1="70" y1="${Y(v)}" x2="${X(90)}" y2="${Y(v)}" stroke="#dde3e6"/><text x="60" y="${Y(v)+4}" font-size="12" text-anchor="end" fill="#5a6b75">${v}</text>`}
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380"><rect width="800" height="380" fill="#ffffff"/>${grid}<path d="${d}" fill="none" stroke="#1F6F8B" stroke-width="2"/>${dots}<text x="400" y="374" font-size="13" text-anchor="middle" fill="#13232c">Z' (Ω)</text><text transform="rotate(-90 20 180)" x="20" y="180" font-size="13" text-anchor="middle" fill="#13232c">−Z'' (Ω)</text><text x="760" y="50" font-size="13" text-anchor="end" fill="#b83b5e">${tr('Demo figure, not measured')}</text></svg>`;
  return 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
}

/* ---------- In-memory database: same interface when cloud storage is unavailable ---------- */
function memDB(initial,onWrite){
  const docs=new Map(Object.entries(initial||{})),subs=new Set();const fire=()=>setTimeout(()=>subs.forEach(f=>f()));
  const touch=p=>{fire();if(onWrite)onWrite(p)};
  const snap=p=>{const d=docs.get(p);return{id:p.split('/').pop(),exists:!!d,data:()=>d?JSON.parse(JSON.stringify(d)):undefined,metadata:{}}};
  const docRef=p=>({id:p.split('/').pop(),path:p,
    async get(){return snap(p)},
    async set(d){docs.set(p,JSON.parse(JSON.stringify(d)));touch(p)},
    async update(d){if(!docs.has(p))throw{code:'invalid_argument'};docs.set(p,{...docs.get(p),...JSON.parse(JSON.stringify(d))});touch(p)},
    async delete(){docs.delete(p);touch(p)},
    onSnapshot(next){const f=()=>next(snap(p));subs.add(f);setTimeout(f);return()=>subs.delete(f)}});
  const col=c=>{const q={orderBy(){return q},limit(){return q},doc:id=>docRef(c+'/'+id),
    onSnapshot(next){const f=()=>{const ds=[...docs.keys()].filter(k=>k.startsWith(c+'/')&&k.split('/').length===c.split('/').length+1).map(snap);next({docs:ds,size:ds.length,empty:!ds.length})};subs.add(f);setTimeout(f);return()=>subs.delete(f)}};return q};
  return{doc:docRef,collection:col,dump:()=>Object.fromEntries(docs),load(o){docs.clear();Object.entries(o).forEach(([k,v])=>docs.set(k,v));fire()}};
}

/* The record is drawn as a discovery tree: the question on the left, each move one column to the right of the move it

   its result, why it was made or stopped, what it corrects, where it comes from, and its data chain. */
const SHAPE_TEXT={dir:'Research question',ok:'Holds',key:'Turning point',root:'Root cause',dead:'Dead end',fix:'Correction',audit:'Independent audit',
  open:'Not resolved yet',clue:'Early clue',todo:'To be tested',out:'Conclusion'};
const KIFU_MODES={all:'All',path:'Main path',dead:'Dead ends',fix:'Corrections and open questions',user:'Started by you',mismatch:'Checks that do not match',nochain:'No data chain yet'};
const KIFU_LAYOUTS={tree:'Tree diagram',time:'Timeline',list:'List'};
const CHAIN_TEXT={recomputed:'Recomputed from the raw files',sourced:'Sources named, not recomputed',none:'No data'};
const ROLE_TEXT={report:'Report',table:'Table',figure:'Figure',slides:'Slides',script:'Script',raw:'Raw data',other:'Other'};

  if(m.kind==='correction')return'fix';if(m.kind==='audit')return'audit';if(m.outcome==='failure')return'dead';
  if(m.status==='active'||m.status==='paused'||m.outcome==='inconclusive')return'open';
  if(m.mark&&m.mark.kind==='interesting')return'clue';return'ok'}
function shapeInto(g,sh){ // the mark of a move, centred on 0,0

  else if(sh==='audit')p({d:'M0,-7.5L6.5,-3.75L6.5,3.75L0,7.5L-6.5,3.75L-6.5,-3.75Z',class:'s-audit'});
  else if(sh==='open')c({r:6,class:'s-open'});

  else if(sh==='key'){c({r:10.5,class:'s-ring'});c({r:6.5,class:'f-path'})}
  else if(sh==='root'){c({r:14,class:'s-ring'});c({r:9,class:'f-path'})}

function shapeIcon(sh,size){const s=el('svg',{width:size||16,height:size||16,viewBox:sh==='root'?'-15 -15 30 30':'-11 -11 22 22','aria-hidden':'true',class:'kico'});
  shapeInto(el('g',{},s),sh);return s}
function moveChain(m){ // how far this move's numbers can be followed back: {level, state}

  if(files.length)return{level:'sourced',state:fstates.includes('stale')?'stale':worst(fstates)};
  if(typeof ev.noData==='string'&&ev.noData.trim())return{level:'none',state:null};
  return{level:null,state:null}}
function kifuView(){return S.kv||(S.kv={layout:'tree',mode:'all',xl:true,z:0,q:'',sel:null,scroll:null})}
function kifuPaths(K){ // the main path: from the question to the moves the report tells, else to the conclusions
  const told=[...K.chapterOf.keys()].filter(id=>K.byId.has(id));

  const on=new Set();ends.forEach(id=>{for(let x=K.byId.get(id);x&&!on.has(x.id);x=x.parent&&K.byId.get(x.parent))on.add(x.id)});

function orderedBlocks(){const ids=(S.meta&&S.meta.order)||[];const seen=new Set();
  const out=ids.map(id=>S.blocks.get(id)).filter(b=>b&&!seen.has(b.id)&&seen.add(b.id));
  [...S.blocks.values()].filter(b=>!seen.has(b.id)).sort((p,q)=>(p.createdAt||'')<(q.createdAt||'')?-1:1).forEach(b=>out.push(b));
  return out}
function paginate(){
  const L=layoutVars();const blocks=orderedBlocks();const mh=$('#measure');mh.replaceChildren();
  const saveGeo=S.geo;S.geo={};
  const groups=blockGroups(blocks);
  const nodes=groups.map(g=>{const n=buildGroup(g,false);mh.append(...n);return n});
  const hts=new Map();$$('.blk',mh).forEach(n=>hts.set(n.dataset.id,n.getBoundingClientRect().height));
  const ghs=groups.map((g,i)=>g.side.length?nodes[i][0].getBoundingClientRect().height:
    g.blocks.reduce((s,b)=>s+(hts.get(b.id)||0),0)+L.gap*(g.blocks.length-1));
  mh.replaceChildren();S.geo=saveGeo;
  const pages=[];let cur=[],hsum=0;
  groups.forEach((g,i)=>{const gh=ghs[i];
    const need=cur.length?hsum+L.gap+gh:gh;
    if(cur.length&&(g.force||need>L.innerH+1)){pages.push(cur);cur=[];hsum=0}
    hsum=cur.length?hsum+L.gap+gh:gh;cur.push(...g.blocks)});
  if(cur.length)pages.push(cur);
  S.pages=pages;S.heights=hts;S.innerH=L.innerH;
  S.starts=new Map();pages.forEach((p,i)=>S.starts.set(p[0].id,i));
  S.page=clamp(S.page,0,Math.max(0,pages.length-1));
}

/* ---------- Shared helpers ---------- */

/* Every change is written to the folder at once; the top bar says so: saving, saved at a time, or a failure */
const SAVE={busy:0,at:null,err:null};
function saving(p){SAVE.busy++;showSave();
  return Promise.resolve(p).then(v=>{SAVE.at=new Date();SAVE.err=null;return v},e=>{SAVE.err=errText(e)||String(e);throw e}).finally(()=>{SAVE.busy--;showSave()})}
function showSave(){const n=$('#savest');if(!n)return;
  const where=S.folder?tr('{a} and {b} in the folder {name}',{a:REPORT_FILE,b:KIFU_FILE,name:S.folder.name}):'';
  if(!S.meta||S.readonly){n.hidden=true;return}n.hidden=false;
  if(!S.folder&&!S.cloud){n.className='savest bad';n.textContent=tr('Not saved to a folder');
    n.title=tr('This report is only in this tab. Open a folder, or save the report file (File menu), to keep it.');return}
  const err=SAVE.err||(S.saveState==='error'?S.saveError||tr('Could not save'):'');
  if(err){n.className='savest bad';n.textContent=tr('Could not save');n.title=err;return}
  if(SAVE.busy||S.saveState==='pending'){n.className='savest busy';n.textContent=tr('Saving…');n.title='';return}
  n.className='savest ok';n.textContent=SAVE.at?tr('Saved automatically {t}',{t:SAVE.at.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}):tr('Saved automatically');

function diffBlock(o,n){
  const out=[];FIELDS.forEach(f=>{const a=getPath(o,f),b=getPath(n,f);if(same(a,b))return;
    if(f==='image.src')out.push({field:f,before:tr('old image'),after:tr('new image'),revertible:false});
    else out.push({field:f,before:clone(a??null),after:clone(b??null)})});

/* ---------- Change log: rounds ---------- */
const lastRoundAt=()=>S.rounds.reduce((m,r)=>r.at>m?r.at:m,'');
const currentChanges=()=>{const t=lastRoundAt();return S.changes.filter(c=>c.at>t)};
function roundOf(at){const rs=[...S.rounds].sort((a,b)=>a.at<b.at?-1:1);const r=rs.find(r=>at<=r.at);return r?r.id:'current'}
async function recordChange(e){
  if(UNDO.undoing)e={...e,undo:true}; // a record made by Undo is not undone again
  const fresh=()=>{if(!UNDO.busy)UNDO.redo=[]}; // a real new change of yours clears Redo
  const blk=e.blockId&&S.blocks.get(e.blockId);const name=e.name||(blk?blockName(e.blockId):'');
  const ex=currentChanges().find(c=>c.by==='user'&&c.blockId===e.blockId&&c.field===e.field);
  if(ex){const m={...ex,after:clone(e.after),at:now(),name:name||ex.name,revertible:ex.revertible!==false&&e.revertible!==false};
    if(same(m.before,m.after)&&m.field!=='image.src'){S.changes=S.changes.filter(c=>c.id!==ex.id);renderPanel();await drop('changes/'+ex.id)}
    else{fresh();S.changes=S.changes.map(c=>c.id===ex.id?m:c);renderPanel();await put('changes/'+ex.id,m)}
    return}
  if(same(e.before,e.after)&&e.field!=='image.src')return;
  fresh();const c={id:uid('c'),by:'user',at:now(),revertible:e.revertible!==false,...e,name};
  S.changes=[...S.changes,c];renderPanel();await put('changes/'+c.id,c);
}
async function finishRound(){
  if(!currentChanges().length){toast(tr('No changes in this round yet'));return}
  const no=S.rounds.reduce((m,r)=>Math.max(m,r.no||0),0)+1;
  const r={id:uid('r'),no,label:tr('Round {n}',{n:no}),by:'user',at:now()};
  S.rounds=[...S.rounds,r];renderPanel();await put('rounds/'+r.id,r);toast(tr('Round {n} completed',{n:no}));
}

  S.blocks.set(nb.id,next);render();

function move(id,d){const o=orderedBlocks().map(b=>b.id);const i=o.indexOf(id),j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];saveOrder(o)}
async function removeBlock(id){

  const snap=strip(b);const ok=JSON.stringify(snap).length<200000;

async function addBlock(type,extra){
  const id=uid('b-');const base={id,type,title:'',caption:'',breakBefore:'auto',createdAt:now()};
  const ds=S.datasets.values().next().value;

  if(type==='image')base.image={...extra,crop:{t:0,r:0,b:0,l:0},width:100,source:{tool:'',file:extra.name||'',note:''}};

async function revertChange(c){
  if(c.revertible===false){toast(tr('This change cannot be reverted automatically'));return}
  if(c.field==='order'){const ids=orderedBlocks().map(b=>b.id);const t=c.before.filter(id=>ids.includes(id));ids.forEach(id=>{if(!t.includes(id))t.push(id)});return saveOrder(t)}
  if(c.field==='add')return removeBlock(c.blockId);
  if(c.field==='delete'){
    if(!c.before||S.blocks.has(c.blockId)){toast(tr('This block cannot be restored'));return}
    const b={...c.before,updatedAt:now()};S.blocks.set(b.id,b);const o=orderedBlocks().map(x=>x.id).filter(x=>x!==b.id);o.splice(clamp(c.index??o.length,0,o.length),0,b.id);
    S.meta={...S.meta,order:o};render();await put('blocks/'+b.id,b);await put('report/meta',S.meta);
    if(currentChanges().some(x=>x.id===c.id)){S.changes=S.changes.filter(x=>x.id!==c.id);renderPanel();await drop('changes/'+c.id)}
    else await recordChange({blockId:b.id,field:'add',before:null,after:typeName(b.type),name:c.name});
    return}
  if(c.field.startsWith('style.'))return saveStyle(setPath(clone(styleNow()),c.field.slice(6),clone(c.before)));
  const b=S.blocks.get(c.blockId);if(!b){toast(tr('This block has been deleted'));return}
  saveBlock(setPath(clone(b),c.field,clone(c.before)));
}

function uploadErr(e){const c=e&&e.code;
  return c==='too_large'?tr('File too large: SVG up to 2 MB, other files up to 20 MB.'):c==='unsupported_type'?tr('This file type is not supported.'):c==='quota_or_state'?tr('This report has run out of storage.')
    :c==='invalid_request'?tr('The file could not be read. Make sure it is UTF-8 encoded.'):c==='rate_limited'?tr('Too many requests. Please try again shortly.'):tr('Upload failed. Please try again.')}
function svgDims(txt){
  try{const d=new DOMParser().parseFromString(txt,'image/svg+xml').documentElement;const num=v=>{const m=/^\s*([\d.]+)\s*(px|pt|mm|cm|in)?/.exec(v||'');if(!m)return 0;
      return +m[1]*({pt:4/3,mm:3.7795,cm:37.795,in:96}[m[2]]||1)};
    let w=num(d.getAttribute('width')),hh=num(d.getAttribute('height'));
    const vb=(d.getAttribute('viewBox')||'').split(/[\s,]+/).map(Number);
    if(!(w>0&&hh>0)&&vb.length===4&&vb[2]>0&&vb[3]>0){w=vb[2];hh=vb[3]}
    return w>0&&hh>0?{w,h:hh}:{w:800,h:600}}catch(e){return{w:800,h:600}}}
const IMG_TYPES={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',svg:'image/svg+xml'};
async function imageFromFile(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase();let type=(f.type||'').toLowerCase();if(!Object.values(IMG_TYPES).includes(type))type=IMG_TYPES[ext]||'';
  if(!type)throw{code:'unsupported_type'};
  const isSvg=type==='image/svg+xml';let w,hh;
  if(isSvg){const d=svgDims(await f.text());w=d.w;hh=d.h}
  else{const url=URL.createObjectURL(f);try{const i=await new Promise((res,rej)=>{const x=new Image();x.onload=()=>res(x);x.onerror=rej;x.src=url});w=i.naturalWidth;hh=i.naturalHeight}finally{URL.revokeObjectURL(url)}}
  if(S.caps.assets){const r=await S.caps.assets.upload(f,{type});S.assetURL.set(r.id,r.url);return{asset:r.id,mime:r.contentType,w,h:hh,name:f.name}}
  if(isSvg){const txt=await f.text();if(txt.length>200000)throw{code:'too_large'};
    return{src:'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(txt))),mime:type,w,h:hh,name:f.name}}

}
let pickTarget=null;
function pickImage(id){pickTarget=id;$('#imgfile').value='';$('#imgfile').click()}
async function fileToDataURL(f){
  const url=URL.createObjectURL(f);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    let w=img.naturalWidth,hh=img.naturalHeight;const k=Math.min(1,1400/Math.max(w,hh));w=Math.round(w*k);hh=Math.round(hh*k);
    const cv=document.createElement('canvas');cv.width=w;cv.height=hh;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,hh);cx.drawImage(img,0,0,w,hh);
    let q=.86,out=cv.toDataURL('image/jpeg',q);while(out.length>230000&&q>.4){q-=.12;out=cv.toDataURL('image/jpeg',q)}
    if(out.length>230000)throw new Error('too big');return out}finally{URL.revokeObjectURL(url)}}

    else addBlock('image',img)}

const PRESETS={
  text:['More concise','More formal','Add data','Add citation','Claim too strong','Translate'],
  chart:['Change chart type','Change axes','Use log scale','Add error bars','Add trend line','Highlight key points','Change colours'],
  table:['Add units','Change sort','Add/remove columns','Highlight key points'],
  image:['Crop','Add labels','Replace image','Add caption'],
  move:['Fill in this move','Recompute this','Needs a clearer reason','Add to the report','Reopen this']};
const tagId=label=>label.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
// questions, on every kind of block and on a move: the agent answers them in its reply rather than changing anything
const ASK_TAGS=[['explain','What does this mean?'],['where-from','Where does the data come from?'],['how-computed','How was it computed?'],
  ['why-so','Why is it so?'],['how-reliable','Can it be trusted?'],['compare','How does it compare?']];
const TAG_LABEL=new Map([...ASK_TAGS,...Object.values(PRESETS).flat().map(l=>[tagId(l),l])]);
function tagChips(type,d){ // two rows of tags: ask, then change; they toggle in the draft d
  const chip=(id,label)=>{const c=h('button',{type:'button',class:'chip','aria-pressed':String(d.tags.includes(id)),text:tr(label)});
    c.onclick=()=>{d.tags=d.tags.includes(id)?d.tags.filter(x=>x!==id):[...d.tags,id];c.setAttribute('aria-pressed',String(d.tags.includes(id)))};return c};
  const change=(PRESETS[type]||[]).map(l=>chip(tagId(l),l));
  return h('div',{class:'chips two'},[h('div',{class:'chiprow'},[h('span',{class:'chipk',text:tr('Ask')}),...ASK_TAGS.map(([id,l])=>chip(id,l))]),
    change.length?h('div',{class:'chiprow'},[h('span',{class:'chipk',text:tr('Change')}),...change]):null])}
[['add-data-files','Add these files to the chart'],['replace-data-files','Replace the data with these files']].forEach(([id,l])=>TAG_LABEL.set(id,l)); // requests made from Folder > Data
// v0.2 stored the visible tag text in the interface language of the time; map any known translation back to its id
const LEGACY_TAGS={'\u63db\u4e00\u5f35':'replace-image'};
let TAG_ALIAS=null;
function tagKey(x){if(TAG_LABEL.has(x))return x;
  if(!TAG_ALIAS){TAG_ALIAS=new Map(Object.entries(LEGACY_TAGS));TAG_LABEL.forEach((l,id)=>{TAG_ALIAS.set(l,id);Object.values(I18N).forEach(t=>{if(t&&typeof t[l]==='string')TAG_ALIAS.set(t[l],id)})})}
  return TAG_ALIAS.get(x)||null}
const tagText=x=>{const id=tagKey(x);return id?tr(TAG_LABEL.get(id)):String(x)};
const tagsText=a=>(a.tags||[]).map(tagText).join(tr(', '));
const draftOf=id=>{if(!S.drafts.has(id))S.drafts.set(id,{text:'',tags:[],target:null});return S.drafts.get(id)};
function startDraw(id,tool){S.draw=(S.draw&&S.draw.blockId===id&&S.draw.tool===tool)?null:{blockId:id,tool};
  document.body.dataset.draw=S.draw?S.draw.tool:'';render();
  if(S.draw)toast(tr('Drag a rectangle on this figure. Press Esc to cancel'))}
function stopDraw(){S.draw=null;document.body.dataset.draw='';render()}
function commentBox(b){
  const d=draftOf(b.id),visual=b.type==='chart'||b.type==='image';
  const box=h('div',{class:'cbox'});
  box.append(tagChips(b.type,d));
  if(d.target&&(d.target.kind!=='block'||d.target.quote))
    box.append(h('p',{class:'ctarget'},[h('span',{text:tr('Location: ')+describe(d.target)}),
      h('button',{type:'button',class:'linkbtn',text:tr('Clear'),onclick:()=>{d.target=null;render()}})]));
  const ta=h('textarea',{class:'cin',rows:'2',placeholder:tr('Describe what to change (or just pick tags above). Ctrl + Enter to send.'),'data-fid':fid(b,'comment')});ta.value=d.text;
  ta.addEventListener('input',()=>{d.text=ta.value});
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();submitDraft(b.id)}});
  const tools=[];
  if(visual){
    // a lasso needs no button: dragging on the figure draws it (see bindDraw)
    tools.push(h('button',{type:'button',class:'btn small','aria-pressed':String(!!(S.draw&&S.draw.blockId===b.id&&S.draw.tool==='box')),text:tr('Box on figure'),onclick:()=>startDraw(b.id,'box')}));
  }
  if(b.type==='text')tools.push(h('button',{type:'button',class:'btn small',text:tr('Quote selected text'),onclick:()=>{const q=S.lastSel[b.id];if(!q){toast(tr('First select some text in the block above'));return}d.target={kind:'block',blockId:b.id,quote:q};render()}}));
  tools.push(h('span',{class:'sp'}));
  tools.push(h('button',{type:'button',class:'btn small',text:tr('Send comment'),onclick:()=>submitDraft(b.id)}));
  tools.push(h('button',{type:'button',class:'btn small primary',text:tr('Send and ask the agent'),onclick:()=>submitAndAsk(b.id)}));
  box.append(ta,examplesFor(d.target&&d.target.kind!=='block'&&b.type==='chart'?'region':b.type,ta,d)||'',attachRow(d)||'',h('div',{class:'crow'},tools));
  if(visual)box.append(h('p',{class:'chint',text:b.type==='chart'?tr('Draw around points on the chart with the mouse, or click one point.'):tr('Draw around a region of the figure with the mouse.')}));
  return box;
}
async function submitDraft(id){
  const d=draftOf(id);const text=d.text.trim();
  if(!text&&!d.tags.length){toast(tr('Write a comment or pick a tag first'));return false}
  const no=S.annos.reduce((m,a)=>Math.max(m,a.no||0),0)+1;
  const a={id:uid('a'),no,target:d.target||{kind:'block',blockId:id},tags:[...d.tags],text,status:'open',reply:'',createdAt:now()};
  if(!editingMode())a.from='view'; // asked while reading: listed in the questions panel
  if(d.withFiles!==false&&S.fsel&&S.fsel.size){a.files=[...S.fsel].map(normPath).sort();S.fsel.clear()} // the files ticked in Folder > Data
  S.drafts.delete(id);S.annos=[...S.annos,a];
  const box=document.activeElement,again=!!box&&box.dataset&&box.dataset.fid===fid({id},'comment'); // sent with Ctrl+Enter: keep typing in a fresh box
  if(again)box.blur();render();if(again){const n=$(`[data-fid="${CSS.escape(fid({id},'comment'))}"]`);if(n)n.focus({preventScroll:true})}
  await put('annotations/'+a.id,a);questionAdded(a);
  return true;
}
function questionAdded(a){ // after a comment is saved: in the view modes it waits in the questions panel
  if(a.from!=='view'){toast(tr('Comment sent #')+a.no);return}
  QA.min=false;saveQA();renderQA(true);toast(tr('Question #{n} added. Send your questions with "Ask the agent" in the questions panel.',{n:a.no}))}
async function submitAndAsk(id){if(await submitDraft(id))await askAgent()}

/* A move of the research record is annotated the same way as a report block (target.kind:"move", moveId): a comment
   box under it in Kifu Edit, replies threaded, and the same "Ask the agent to revise" pipeline — a move is, in effect,
   a page of its own that the agent can be asked to work on, the way a report block is. */
function moveCommentBox(id){
  const key='move:'+id,d=draftOf(key);
  const box=h('div',{class:'cbox'});
  box.append(tagChips('move',d));
  const ta=h('textarea',{class:'cin',rows:'2',placeholder:tr('Describe what to change (or just pick tags above). Ctrl + Enter to send.'),'data-fid':fid({id:key},'comment')});ta.value=d.text;
  ta.addEventListener('input',()=>{d.text=ta.value});
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();submitMoveDraft(id)}});
  const tools=[h('span',{class:'sp'}),
    h('button',{type:'button',class:'btn small',text:tr('Send comment'),onclick:()=>submitMoveDraft(id)}),
    h('button',{type:'button',class:'btn small primary',text:tr('Send and ask the agent'),onclick:()=>submitAndAskMove(id)})];
  box.append(ta,examplesFor('move',ta,d)||'',attachRow(d)||'',h('div',{class:'crow'},tools));
  return box;
}
async function submitMoveDraft(id){
  const key='move:'+id,d=draftOf(key),text=d.text.trim();
  if(!text&&!d.tags.length){toast(tr('Write a comment or pick a tag first'));return false}
  const no=S.annos.reduce((m,a)=>Math.max(m,a.no||0),0)+1;
  const a={id:uid('a'),no,target:d.target&&d.target.kind==='move'?d.target:{kind:'move',moveId:id},tags:[...d.tags],text,status:'open',reply:'',createdAt:now()};
  if(!editingMode())a.from='view';
  if(d.withFiles!==false&&S.fsel&&S.fsel.size){a.files=[...S.fsel].map(normPath).sort();S.fsel.clear()}
  S.drafts.delete(key);S.annos=[...S.annos,a];render();
  await put('annotations/'+a.id,a);questionAdded(a);
  return true;
}
async function submitAndAskMove(id){if(await submitMoveDraft(id))await askAgent()}
function moveComments(id){ // the thread for this move, wherever it is shown (View or Edit)
  const list=S.annos.filter(a=>a.target&&a.target.kind==='move'&&a.target.moveId===id).sort((p,q)=>(q.no||0)-(p.no||0));
  if(!list.length)return null;
  return h('div',{class:'kcomments'},[h('h3',{text:tr('Comments')}),...list.map(a=>{const done=a.status==='done';
    return h('div',{class:'anno'+(done?' is-done':'')},[
      h('div',{class:'atop'},[h('span',{class:'no',text:String(a.no||'?')}),h('span',{class:'chip2',text:done?tr('Done'):tr('Open')})]),
      a.tags&&a.tags.length?h('p',{class:'tags'},a.tags.map(x=>h('span',{class:'tag',text:tagText(x)}))):null,
      a.text?h('p',{class:'txt',text:a.text}):null,
      ...threadOf(a).map(m=>h('p',{class:'reply'+(m.by==='user'?' me':'')},[h('strong',{text:m.by==='user'?tr('You: '):tr('Agent: ')}),m.text])),
      !S.readonly&&threadOf(a).some(m=>m.by!=='user')?replyBox(a):null,
      !S.readonly?h('div',{class:'acts'},[h('button',{type:'button',text:done?tr('Reopen'):tr('Mark done'),onclick:()=>setStatus(a,done?'open':'done')}),
        h('button',{type:'button',text:tr('Delete'),onclick:()=>removeAnno(a)})]):null])})]);
}

/* Example requests: general scientific wording the user can insert and edit; [...] marks what to fill in */
const EXAMPLES={
  chart:[['Appearance',['Use a log scale for the Y axis.','Set the Y axis range from […] to […].','Make it a line chart, sorted by […].']],
    ['Range',['Only show the data where […].','Leave out empty values and outliers (say how you define them); keep the original data.']],
    ['Data',['Add the attached files to this chart, one series per […].','Replace the data of this chart with the attached files; keep the axes and titles.','Use […] for the X axis and […] for the Y axis.']],
    ['Compare',['Plot […] and […] in this chart, in different colours.','Split it into two panels: […] and […].','Add a y = x line to compare the two measurements.']],
    ['Statistics',['Add a linear trend line with R².','Add error bars from the standard deviation of […].','Compute the correlation between […] and […] and explain it in plain words in the caption.']],
    ['Export',['Export the data of this chart as CSV, one file per […].','Export this figure for publication ([…] column width).']]],
  region:[['',['Why are these points different? Compare them with the rest.','Mark these points and explain what they have in common.','Leave these points out and say why in the caption; keep the original data.','Fit these points separately from the rest.']]],
  table:[['',['Sort by […] and show the first […] rows.','Add units to the column headers.','Add a column with […].','Show the mean and standard deviation per […].']]],
  text:[['',['Make it shorter and keep the numbers.','Give the source dataset for every number.','Make the conclusion more cautious: separate what the data shows from interpretation.','Add a short method paragraph: how the numbers were computed.']]],
  image:[['',['Replace it with […].','Crop the white space and enlarge […].','Write a caption that explains the axes and units.']]],
  move:[['',['Recompute this against the raw files and say whether it still holds.','Write down why this move stopped, and what would make it worth reopening.','Add the report chapter that discusses this move to its source.','Check whether this move corrects or is corrected by another one.']]]};
function examplesFor(kind,ta,d){ // a closed list; a click puts the sentence into the comment box, to edit
  const groups=EXAMPLES[kind];if(!groups)return null;
  const insert=s=>{const v=ta.value,at=ta.selectionStart??v.length,pre=v.slice(0,at),sep=pre&&!/\s$/.test(pre)?' ':'';
    ta.value=pre+sep+s+v.slice(at);d.text=ta.value;ta.focus();const i=ta.value.indexOf('[…]',at);if(i>=0)ta.setSelectionRange(i,i+3);else ta.setSelectionRange(at+sep.length+s.length,at+sep.length+s.length)};
  return h('details',{class:'ex'},[h('summary',{text:tr('Example requests')}),...groups.map(([cat,list])=>h('div',{class:'exrow'},[
    cat?h('span',{class:'excat',text:tr(cat)}):null,...list.map(s=>h('button',{type:'button',class:'exs',text:tr(s),onclick:()=>insert(tr(s))}))]))]);
}
function attachRow(d){ // offer the files ticked in Folder > Data
  const n=S.fsel?S.fsel.size:0;if(!n)return null;
  const cb=h('input',{type:'checkbox'});cb.checked=d.withFiles!==false;cb.onchange=()=>{d.withFiles=cb.checked};
  return h('label',{class:'chk attach'},[cb,h('span',{text:tr('Attach the {n} files ticked in the Folder tab ({sum})',{n,sum:pathsSummary([...S.fsel])})})]);
}
function renderEdit(){
  $('#compactBtn').setAttribute('aria-pressed',String(!!S.compact));$('#addrow').hidden=!!S.compact;
  if(S.compact)return renderCompact();
  const flow=$('#flow');flow.replaceChildren();flow.classList.remove('compact');S.geo={};
  const blocks=orderedBlocks();
  blocks.forEach((b,i)=>{
    const cw=h('div',{class:'cw','data-id':b.id});
    if(i===0)cw.append(h('div',{class:'pstart',text:tr('Page 1')}));else cw.append(breakBar(b));
    const card=h('div',{class:'card'+(S.draw&&S.draw.blockId===b.id?' drawing':'')});
    const tooTall=(S.heights.get(b.id)||0)>S.innerH+2;if(tooTall)card.classList.add('over-page');
    const del=h('button',{type:'button',class:'btn small',text:tr('Delete')});
    del.onclick=()=>{if(del.dataset.arm){removeBlock(b.id)}else{del.dataset.arm='1';del.textContent=tr('Confirm delete?');setTimeout(()=>{if(del.isConnected){delete del.dataset.arm;del.textContent=tr('Delete')}},3000)}};
    card.append(h('div',{class:'chead'},[
      h('span',{class:'hdl',title:tr('Drag to reorder'),text:'⠿'}),h('span',{text:isChapter(b)?tr('Chapter'):typeName(b.type)}),
      tooTall?h('span',{class:'warn',text:tr('Taller than one page; it will shrink or scroll in view mode')}):null,
      blockDatasetIds(b).some(id=>S.stale.has(id))?h('span',{class:'warn',text:tr('Source data changed since import')}):
        blockChainState(b)==='stale'?h('span',{class:'warn',text:tr('Needs recomputing')}):null,
      h('span',{class:'sp'}),
      h('button',{type:'button',class:'btn small',text:tr('Up'),disabled:i===0?'':null,onclick:()=>move(b.id,-1)}),
      h('button',{type:'button',class:'btn small',text:tr('Down'),disabled:i===blocks.length-1?'':null,onclick:()=>move(b.id,1)}),
      del]));
    card.append(editForm(b),commentBox(b));
    cw.append(card);flow.append(cw);
  });
  if(window.Sortable){if(S.sortable)S.sortable.destroy();
    S.sortable=Sortable.create(flow,{handle:'.hdl',draggable:'.cw',animation:150,ghostClass:'ghost',
      onEnd:()=>{const o=$$('.cw',flow).map(n=>n.dataset.id);if(!same(o,orderedBlocks().map(b=>b.id)))saveOrder(o)}})}
  paintAllOverlays();
}

/* Reorder view: one line per block, one card per group of blocks kept together, page by page */
function blockLabel(b){if(b.title)return b.title;
  if(b.type==='text'){const t=(b.text||'').replace(/[*_#>`]/g,'').replace(/^\s*- /gm,'').replace(/\s+/g,' ').trim();return t.length>70?t.slice(0,70)+'…':t}
  return b.caption||typeName(b.type)}
function renderCompact(){
  const flow=$('#flow');flow.replaceChildren();flow.classList.add('compact');S.geo={};
  S.pages.forEach((p,i)=>{flow.append(h('div',{class:'pgsep',text:tr('Page {n}',{n:i+1})}));
    blockGroups(p).forEach(g=>flow.append(h('div',{class:'cg','data-ids':g.blocks.map(b=>b.id).join(' '),title:tr('Drag to reorder')},[
      h('span',{class:'hdl',text:'⠿'}),
      h('div',{class:'cgl'},g.blocks.map(b=>h('div',{class:'cgi'+(b.breakBefore==='beside'&&g.side.includes(b)?' side':'')},[
        h('span',{class:'ty',text:typeName(b.type)}),h('span',{class:'tt',text:blockLabel(b)})])))])))});
  if(window.Sortable){if(S.sortable)S.sortable.destroy();
    S.sortable=Sortable.create(flow,{draggable:'.cg',animation:150,ghostClass:'ghost',
      onEnd:()=>{const o=$$('.cg',flow).flatMap(n=>n.dataset.ids.split(' '));if(!same(o,orderedBlocks().map(b=>b.id)))saveOrder(o)}})}
}

/* ---------- Comment text ---------- */
const KIND={block:'Block',point:'Data point',box:'Box',lasso:'Lasso',move:'Move'};
function ids(l){const a=(l||[]).slice(0,10).map(i=>'#'+i).join(' ');return(l||[]).length>10?a+' …':a}
function blockName(id){const b=S.blocks.get(id);if(!b){const c=S.changes.find(c=>c.blockId===id&&c.name);return c?c.name:tr('(deleted block)')}return b.title||tr('{t} block',{t:typeName(b.type)})}
function describe(t){
  try{
    if(t.kind==='move'){const mv=(S.kifu&&S.kifu.data&&S.kifu.data.moves)||{},m=mv[t.moveId];if(!m)return tr('(move not found)');
      const nm=moveNo(m)+' '+(m.title||t.moveId);
      if(t.region&&t.file)return tr('{nm}: a region of {file}',{nm,file:baseName(t.file)});
      return nm+(t.file?' · '+baseName(t.file):'')+(t.quote?tr(': "{q}"',{q:t.quote.length>40?t.quote.slice(0,40)+'…':t.quote}):'')}
    const nm=blockName(t.blockId);
    if(t.kind==='block')return nm+(t.quote?tr(': "{q}"',{q:t.quote.length>40?t.quote.slice(0,40)+'…':t.quote}):'');
    if(t.kind==='point'){const b=S.blocks.get(t.blockId),ds=b&&b.chart&&pointDataset(b,t),r=ds&&ds.rows.find(r=>r.id===t.rowId),s=b&&ds?seriesFor(b,ds.id):{};
      return tr('{nm}: data point #{id}',{nm,id:t.rowId})+(t.datasetId&&ds?' · '+seriesName(s):'')+(r?tr(' ({xl} {xv}, {yl} {yv})',{xl:colLabel(ds,s.x),xv:fmt(r[s.x]),yl:colLabel(ds,s.y),yv:fmt(r[s.y])}):'')}
    const b=S.blocks.get(t.blockId);
    if(t.space==='image')return tr(t.kind==='box'?tr('{nm}: box on an image region'):tr('{nm}: lasso on an image region'),{nm});
    const ds=b&&b.chart&&S.datasets.get(b.chart.dataset);const xl=ds?colLabel(ds,t.xKey):t.xKey,yl=ds?colLabel(ds,t.yKey):t.yKey;
    const all=t.enclosedBy&&typeof t.enclosedBy==='object'?Object.values(t.enclosedBy).flat():t.enclosed||[];
    const enc=all.length?tr(', {n} points ({ids})',{n:all.length,ids:ids(all)}):tr(', no data points in range');
    if(t.kind==='box')return tr('{nm}: {xl} {x0}–{x1}, {yl} {y0}–{y1}{enc}',{nm,xl,x0:fmt(t.x[0]),x1:fmt(t.x[1]),yl,y0:fmt(t.y[0]),y1:fmt(t.y[1]),enc});
    return tr('{nm}: lasso{enc}',{nm,enc});
  }catch(e){return tr('(location unavailable)')}
}

/* ---------- Panel: comments ---------- */
async function setStatus(a,status){const m={...a,status,resolvedAt:status==='done'?now():null};S.annos=S.annos.map(x=>x.id===a.id?m:x);renderPanel();paintAllOverlays();await put('annotations/'+a.id,m)}
async function removeAnno(a){S.annos=S.annos.filter(x=>x.id!==a.id);renderPanel();paintAllOverlays();await drop('annotations/'+a.id)}
// The conversation after a comment: thread = [{by: "user"|"claude", text, at}]. Older reports only have reply.
const threadOf=a=>Array.isArray(a.thread)&&a.thread.length?a.thread.filter(m=>m&&m.text):a.reply?[{by:'claude',text:a.reply,at:a.resolvedAt||''}]:[];
async function replyAnno(a,text){text=String(text||'').trim();if(!text)return;
  const m={...a,thread:[...threadOf(a),{by:'user',text,at:now()}],status:'open',resolvedAt:null}; // answering reopens the comment for the agent
  S.replyDrafts&&S.replyDrafts.delete(a.id);S.annos=S.annos.map(x=>x.id===a.id?m:x);renderPanel();renderQA(true);paintAllOverlays();await put('annotations/'+a.id,m);
  toast(tr('Reply added. Click "Ask the agent to revise" when you are ready.'))}
function replyBox(a){
  S.replyDrafts=S.replyDrafts||new Map();
  const ta=h('textarea',{rows:'2',placeholder:tr('Answer the agent…'),'data-fid':'reply:'+a.id});ta.value=S.replyDrafts.get(a.id)||'';
  ta.addEventListener('input',()=>S.replyDrafts.set(a.id,ta.value));
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();replyAnno(a,ta.value)}});
  return h('div',{class:'areply'},[ta,h('button',{type:'button',class:'btn small',text:tr('Reply'),onclick:()=>replyAnno(a,ta.value)})]);
}
function renderAnnos(){
  const ae=document.activeElement;if(ae&&ae.dataset&&String(ae.dataset.fid||'').startsWith('reply:')&&$('#list').contains(ae)){S.deferred=true;return} // typing a reply: refresh on leaving the box
  $$('#filters button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===S.filter)));
  const list=$('#list');list.replaceChildren();
  const shown=S.annos.filter(a=>S.filter==='all'||(S.filter==='done'?a.status==='done':a.status!=='done')).sort((p,q)=>(q.no||0)-(p.no||0));
  if(!shown.length){list.append(h('li',{class:'empty',text:S.annos.length?tr('No comments in this filter.'):tr('No comments yet. In Edit mode, every block has a comment box below it.')}));return}
  shown.forEach(a=>{const t=a.target||{},done=a.status==='done';
    list.append(h('li',{class:'anno'+(done?' is-done':'')},[
      h('div',{class:'atop'},[h('span',{class:'no',text:String(a.no||'?')}),h('span',{class:'kind',text:KIND[t.kind]?tr(KIND[t.kind]):tr('Comments')}),h('span',{class:'chip2',text:done?tr('Done'):tr('Open')})]),
      h('p',{class:'where',text:describe(t)}),
      a.tags&&a.tags.length?h('p',{class:'tags'},a.tags.map(x=>h('span',{class:'tag',text:tagText(x)}))):null,

    let t;

      if(Math.abs(x1-x0)<6*scale||Math.abs(y1-y0)<6*scale){toast(tr('Area too small. Drag a larger rectangle'));return}

// Python writes NaN and Infinity, and some Windows tools start a file with a byte order mark; browsers accept neither.
function lenientJSON(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  try{return{value:JSON.parse(text),fixed:0}}catch(e0){
    let out='',inStr=false,n=0;
    for(let i=0;i<text.length;i++){const c=text[i];
      if(inStr){out+=c;if(c==='\\'){out+=text[i+1]||'';i++}else if(c==='"')inStr=false;continue}
      if(c==='"'){inStr=true;out+=c;continue}
      if(c==='N'&&text.startsWith('NaN',i)){out+='null';i+=2;n++;continue}
      if(c==='I'&&text.startsWith('Infinity',i)){out+='null';i+=7;n++;continue}

// httpRoot() offers the part of the File System Access API that the folder code uses, so that code stays the same.
function httpRoot(token,name){
  const call=(path,opt)=>launcherFetch('/fs/'+path.split('/').map(encodeURIComponent).join('/'),{...(opt||{}),headers:{'X-Duetkifu-Token':token}});
  const missing=n=>new DOMException(n+' not found','NotFoundError');
  const file=(path,fname,meta)=>({kind:'file',name:fname,meta,
    async getFile(){const r=await call(path);if(r.status===404)throw missing(fname);if(!r.ok)throw new Error(fname+': '+r.status+' '+await r.text());
      return new File([await r.blob()],fname,{type:r.headers.get('Content-Type')||'',lastModified:+r.headers.get('X-Mtime')||Date.now()})},
    async mtime(){const r=await call(path,{method:'HEAD'});if(!r.ok)throw missing(fname);return +r.headers.get('X-Mtime')},
    async createWritable(){const parts=[];return{async write(d){parts.push(d)},
      async close(){const r=await call(path,{method:'PUT',body:new Blob(parts)});if(!r.ok)throw new Error(r.status+' '+await r.text())}}}});
  const dir=(path,dname)=>({kind:'directory',name:dname,virtual:true,
    async getFileHandle(n,o){const p=path+n,r=await call(p,{method:'HEAD'});
      if(!r.ok){if(!(o&&o.create))throw missing(n);const w=await call(p,{method:'PUT',body:''});if(!w.ok)throw new Error(w.status+' '+await w.text())} // like the real API: create an empty file
      return file(p,n)},
    async getDirectoryHandle(n,o){const p=path+n+'/',r=await call(p,{method:o&&o.create?'POST':'HEAD'});if(!r.ok)throw missing(n);return dir(p,n)},
    async *entries(){const r=await call(path);if(!r.ok)return;
      for(const x of await r.json())yield[x.name,x.kind==='file'?file(path+x.name,x.name,{size:x.size,lastModified:x.mtime}):dir(path+x.name+'/',x.name)]},
    async queryPermission(){return'granted'},async requestPermission(){return'granted'}});
  return dir('',name);
}

async function folderDB(dir,seedDocs){

  catch(e){if(!(e&&e.name==='NotFoundError'))throw e}
  const stamp=async()=>fh.mtime?await fh.mtime():(await fh.getFile()).lastModified;
  const dirty=new Set();let timer=null,busy=false;
  const mem=memDB(docs||seedDocs||{},p=>{dirty.add(p);setSave('pending');clearTimeout(timer);timer=setTimeout(flush,400)});
  async function flush(){
    if(busy){clearTimeout(timer);timer=setTimeout(flush,200);return}
    if(!dirty.size)return;busy=true;const mine=new Set(dirty);dirty.clear();clearTimeout(retryT);
    try{fh=fh||await dir.getFileHandle(REPORT_FILE,{create:true});
      const f=await fh.getFile();let all=mem.dump();
      if(f.size&&f.lastModified!==known){ // someone else wrote the file since we read it: keep their documents, put ours on top
        const text=await f.text();let next=null;

          logIssue('error',e.msg,(e.detail?e.detail+'\n':'')+tr('Your changes were saved over it. The unreadable file was kept as exports/{f}.',{f:copy}))}
        if(next){mine.forEach(p=>{if(p in all)next[p]=all[p];else delete next[p]});all=next;mem.load(all)}}
      await writeFile(dir,REPORT_FILE,JSON.stringify(reportFromDocs(all),null,1)+'\n');
      known=await stamp();retry=0;setSave(dirty.size?'pending':'saved')}
    catch(e){mine.forEach(p=>dirty.add(p));setSave('error',e);
      if(!retry)logIssue('error',tr('Could not save report.json. Duetkifu keeps trying.'),errText(e));

    catch(e){} // no report.json yet

  if(!docs){dirty.add('report/meta');await flush()} // a new folder gets its report.json right away

function parseDelimited(txt){
  const first=txt.split(/\r?\n/,1)[0];const d=[',','\t',';'].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===d){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

  const MAX=20000;if(objs.length>MAX)throw{msg:tr('Too many rows ({n}). The limit is {max}.',{n:objs.length,max:MAX})};
  const src=cols?cols.map(c=>({key:String(c.key),label:String(c.label??c.key)})):[...new Set(objs.flatMap(o=>Object.keys(o)))].map(k=>({key:k,label:k}));
  const used=new Set(['id']);
  const keyOf=s=>{let k=String(s).trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'col';if(/^\d/.test(k))k='c'+k;let x=k,i=2;while(used.has(x))x=k+'_'+i++;used.add(x);return x};

    const s=String(v).trim();if(s==='')return null;return/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(s)?+s:s};

  src.forEach(c=>{if(useIds&&c===idCol)return;const k=keyOf(c.key);columns.push({key:k,label:c.label});map.push([c.key,k])});
  const rows=objs.map((o,i)=>{const r={id:useIds?ids[i]:i+1};map.forEach(([from,to])=>{r[to]=val(o[from])});return r});

function parseDataFile(name,text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  if(/\.json$/i.test(name)){let j;try{j=JSON.parse(text)}catch(e){throw{msg:tr('{file} is not valid JSON.',{file:name})}}
    if(j&&Array.isArray(j.columns)&&Array.isArray(j.rows))return tableFromObjects(j.rows,j.columns,'json');
    if(Array.isArray(j)&&j.length&&j.every(r=>r&&typeof r==='object'&&!Array.isArray(r)))return tableFromObjects(j,null,'json');
    throw{msg:tr('{file}: the JSON must be a list of objects, or an object with "columns" and "rows".',{file:name})}}
  const grid=parseDelimited(text);if(grid.length<2)throw{msg:tr('{file} needs a header row and at least one data row.',{file:name})};
  const head=grid[0].map((k,i)=>k.trim()||'col'+(i+1));
  return tableFromObjects(grid.slice(1).map(r=>Object.fromEntries(head.map((k,i)=>[k,r[i]]))),head.map(k=>({key:k,label:k})),'delimited');

function uniqueDatasetId(fname){let k=fname.replace(/\.[^.]+$/,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'data';let x=k,i=2;while(S.datasets.has(x))x=k+'-'+i++;return x}

    const ds={id,title:old?old.title:f.name.replace(/\.[^.]+$/,''),columns:table.columns,rows:table.rows,
      source:{path:f.path,sha256:await sha256(buf),size:file.size,modified:new Date(file.lastModified).toISOString(),importedAt:now(),parser:table.parser}};

/* habits/: learn the user's figure style from their own files, then let them confirm */
function parseMplstyle(txt){
  const kv={};txt.split(/\r?\n/).forEach(l=>{const m=/^\s*([\w.-]+)\s*:\s*(.*?)\s*(#.*)?$/.exec(l);if(m)kv[m[1]]=m[2].replace(/^['"]|['"]$/g,'')});
  const out={},num=k=>{const v=parseFloat(kv[k]);return isFinite(v)?v:null},yes=v=>/^true$/i.test(String(v||'').trim());
  let fam=(kv['font.family']||'').split(',')[0].trim();if(/^(sans-serif|serif|monospace)$/.test(fam))fam=(kv['font.'+fam]||'').split(',')[0].trim();if(fam)out['font.family']=fam;
  const tick=num('xtick.labelsize')??num('font.size');if(tick)out['font.size']=tick;
  if(num('axes.labelsize'))out['font.label']=num('axes.labelsize');
  if(num('lines.linewidth'))out.line=num('lines.linewidth');
  if(num('lines.markersize'))out.marker=num('lines.markersize');
  if(/^(in|out)$/.test(kv['xtick.direction']||''))out.ticks=kv['xtick.direction'];
  if(kv['axes.grid']!=null)out.grid=yes(kv['axes.grid']);
  if(kv['axes.spines.top']!=null||kv['axes.spines.right']!=null)out.frame=yes(kv['axes.spines.top']??kv['axes.spines.right']);
  const cyc=/color'?\s*,\s*\[([^\]]*)\]/.exec(kv['axes.prop_cycle']||'');
  if(cyc){const pal=cyc[1].split(',').map(s=>s.trim().replace(/['"]/g,'')).map(s=>parseColor(/^[0-9a-f]{6}$/i.test(s)?'#'+s:s)).filter(Boolean).slice(0,6);if(pal.length)out.palette=pal}
  const w=parseFloat((kv['figure.figsize']||'').split(',')[0]);if(w>0){const pt=w*72;out['figure.preset']=Math.abs(pt-234)<25?'acs1':Math.abs(pt-504)<40?'acs2':'free'}
  return out;
}
function validStyleValue(f,v){
  if(['font.size','font.label','marker','line'].includes(f))return typeof v==='number'&&v>0&&v<100;
  if(f==='font.family')return typeof v==='string'&&v.length<80;
  if(f==='ticks')return v==='in'||v==='out';
  if(f==='frame'||f==='grid')return typeof v==='boolean';
  if(f==='palette')return Array.isArray(v)&&v.length<=6&&v.every(c=>/^#[0-9a-f]{6}$/i.test(c));
  if(f==='figure.preset')return typeof v==='string'&&v in PRESET_PT;
  if(f==='chartDefaults.kind')return v===null||v==='scatter'||v==='line';
  if(f==='chartDefaults.logY')return v===null||typeof v==='boolean';
  return false;
}
const effective=(st,f)=>f==='palette'?[...Array(6)].map((_,i)=>st.palette[i]||DEFAULT_PALETTE[i]):getPath(st,f);
async function learnHabits(){
  if(!S.folder||S.learning)return;S.learning=true;renderPanel();
  try{const hd=await subdir(S.folder.dir,'habits'),files=[...await listFiles(hd,HABIT_EXT),...await listFiles(await subdir(hd,'figures'),HABIT_EXT)];
    const votes=new Map();let n=0,profile=null;
    const vote=(field,value,file,source)=>{if(value==null||value===''||!validStyleValue(field,value))return;
      const m=votes.get(field)||votes.set(field,new Map()).get(field),k=JSON.stringify(value);const e=m.get(k)||m.set(k,{value,source,files:[]}).get(k);e.files.push(file);if(e.source!==source)e.source='files'};
    for(const fh of files){const name=fh.name,text=async()=>(await fh.getFile()).text();
      if(/\.svg$/i.test(name)){n++;const a=analyzeSVG(await text());vote('font.family',a.family,name,'svg');vote('font.size',a.size,name,'svg');vote('line',a.line,name,'svg');
        if(a.palette.length)vote('palette',a.palette,name,'svg');
        if(a.widthPt){const p=Math.abs(a.widthPt-234)<25?'acs1':Math.abs(a.widthPt-504)<40?'acs2':null;if(p)vote('figure.preset',p,name,'svg')}}
      else if(/\.mplstyle$/i.test(name)){n++;Object.entries(parseMplstyle(await text())).forEach(([f,v])=>vote(f,v,name,'mplstyle'))}
      else if(name==='profile.json'){try{profile=JSON.parse(await text())}catch(e){}}}
    const st=styleNow(),rows=profileRows(profile);
    votes.forEach((m,field)=>{if(rows.some(r=>r.field===field))return;const best=[...m.values()].sort((a,b)=>b.files.length-a.files.length)[0];
      if(same(best.value,effective(st,field)))return;
      rows.push({field,value:best.value,source:best.source,on:best.files.length*2>=n,
        from:tr('{k} of {n} files: {files}',{k:best.files.length,n,files:best.files.slice(0,3).join(', ')+(best.files.length>3?', …':'')})})});
    S.proposal=rows;S.tab='style';
    if(!rows.length)toast(n||profile?tr('Your habits already match the current style. Nothing to change.'):tr('No SVG, .mplstyle or profile.json files in habits/.'))}
  catch(e){fail(tr('Analysis failed. Please try again.'),e)}
  finally{S.learning=false;renderPanel()}
}
function profileRows(profile){ // style suggestions from saved habits (habits/profile.json or the personal copy)
  const st=styleNow(),rows=[];

/* ---------- Data chain ----------
   steps/{id} records one computation: a script turned input files into output files. A file is known by its path
   (relative to the folder of report.json) and its SHA-256; a file that no step produced is raw data. Following the
   source file of a dataset back through the steps that made it gives the whole chain, down to the raw files.
   A step needs recomputing when its script or an input changed, or an input comes from a step that needs recomputing.
   The page checks the files itself: through the launcher, which keeps a fingerprint cache on disk, or directly in a
   folder opened in the page. Size and modification time are compared first, so large raw files are only read when
   they differ. In a Claude Artifact or a read-only copy nothing can be checked, and the chain is shown in grey. */

const isAbsPath=p=>/^([A-Za-z]:|[\\/])/.test(String(p||''));

const worst=list=>list.includes('stale')?'stale':list.every(x=>x==='ok')?'ok':'unchecked';
const fileState=r=>{const f=r&&S.fstate&&S.fstate.get(refKey(r));return f?f.state:null}; // same, changed, missing, outside, unknown
const stateOf=st=>st==='same'?'ok':st==='changed'||st==='missing'||st==='outside'?'stale':'unchecked';
const rootName=()=>(S.folder&&S.folder.name)||'';
function fileWhy(r,role){const st=fileState(r),f={file:r.path};
  return st==='missing'?tr('{file} is missing',f):st==='outside'?tr('{file} is outside "{folder}"',{...f,folder:rootName()})
    :st==='changed'?(role==='output'?tr('{file} changed after the step was recorded',f):role==='source'?tr('{file} changed since import',f):tr('{file} changed',f)):null}
function chain(){ // the graph of steps, files, datasets and blocks; rebuilt on every render

    stepFiles(s).forEach(([role,r])=>{const w=fileWhy(r,role);if(w)why.push(w);else states.push(stateOf(fileState(r)))});

    derived:[...madeBy.keys()],raw:[...inputs].filter(p=>!madeBy.has(p)).sort(),scripts:[...scripts].sort()};
}
const blockSources=b=>blockDatasetIds(b).map(id=>S.datasets.get(id)).filter(d=>d&&d.source&&d.source.path); // datasets of a block that come from files
function blockChainState(b){const L=blockSources(b);return L.length?worst(L.map(d=>chain().datasetStatus(d).state)):null}
const STATE_TEXT={ok:'Up to date',stale:'Needs recomputing',unchecked:'Not checked'};
const dot=st=>h('span',{class:'dot '+(st||''),title:tr(STATE_TEXT[st]||'Not checked')});
const scriptName=s=>s.script&&s.script.path?baseName(s.script.path):s.id;
function inputCount(C,s){const ins=(s.inputs||[]).filter(r=>r&&r.path),d=ins.filter(r=>C.madeBy.has(normPath(r.path))).length;return{d,r:ins.length-d}}
function sourceLine(b){ // under a chart or table: where its data comes from, with the state of the whole chain
  const L=blockSources(b);if(!L.length)return null;
  if(L.length>1){const C=chain(),state=worst(L.map(d=>C.datasetStatus(d).state));
    return h('button',{type:'button',class:'srcl',title:tr(STATE_TEXT[state])+'. '+tr('Click to see the whole data chain.'),onclick:e=>{e.stopPropagation();openChainMany(L,b)}},
      [dot(state),h('span',{class:'t',text:tr('Source: {n} datasets ({files})',{n:L.length,files:L.slice(0,3).map(d=>baseName(d.source.path)).join(', ')+(L.length>3?', …':'')})})])}
  const d=L[0];

const fileDot=r=>chain().isNew(r.path)?'stale':stateOf(fileState(r));
function fileRow(r){ // one file: state, path, fingerprint, size, date

  if(chain().isNew(r.path))return h('div',{class:'fr'},[dot('stale'),h('span',{class:'mono',text:r.path}),h('span',{class:'bad',text:tr('new, not used yet')}),rv]);

function groupByFolder(refs){const m=new Map();

  return[...m.entries()].sort((a,b)=>a[0]<b[0]?-1:1)}
function lazyDetails(summary,fill,key){ // a <details> whose content is built when it is first opened (a folder may hold hundreds of files)

const hashMemo=new Map(); // path|size|time -> sha256, for this page session
async function localFingerprint(r){
  const F=S.folder,out={path:r.path,state:'missing'};
  if(isAbsPath(r.path))return{...out,state:'outside'};
  const segs=normPath((F.dir!==F.root?F.dir.name+'/':'')+normPath(r.path)).split('/');
  if(segs[0]==='..')return{...out,state:'outside'};
  try{let d=F.root;for(const s of segs.slice(0,-1))d=await d.getDirectoryHandle(s);
    const f=await(await d.getFileHandle(segs[segs.length-1])).getFile(),rec=r.modified?Date.parse(r.modified):NaN;
    Object.assign(out,{size:f.size,modified:new Date(f.lastModified).toISOString()});
    if(r.sha256&&r.size===f.size&&Math.abs(rec-f.lastModified)<=SLACK_MS)return{...out,state:'same',sha256:r.sha256};
    const k=normPath(r.path)+'|'+f.size+'|'+f.lastModified;let sha=hashMemo.get(k);
    if(!sha){sha=await sha256(await f.arrayBuffer());hashMemo.set(k,sha)}
    return{...out,sha256:sha,state:!r.sha256?'unknown':sha===r.sha256?'same':'changed'}}
  catch(e){return out}
}
// A step's inputPatterns (for example ../Data/<any folder>/run*.csv) find files added since it ran:
// * ? and [abc] match within a name, ** matches any number of folders (as in Python's glob with recursive=True)
function globRegex(seg){let r='';
  for(let i=0;i<seg.length;i++){const c=seg[i];
    if(c==='*')r+='[^/]*';else if(c==='?')r+='[^/]';
    else if(c==='['&&seg.indexOf(']',i+2)>i){const j=seg.indexOf(']',i+2);let cls=seg.slice(i+1,j);if(cls[0]==='!')cls='^'+cls.slice(1);r+='['+cls.replace(/\\/g,'\\\\')+']';i=j}
    else r+=c.replace(/[.+^${}()|[\]\\]/g,'\\$&')}
  return new RegExp('^'+r+'$')}
async function globFiles(pattern){ // paths relative to the folder of report.json, like Python's glob(recursive=True)
  const F=S.folder;if(!F||isAbsPath(pattern))return[];
  const base=F.dir!==F.root?F.dir.name+'/':'',segs=normPath(base+String(pattern).replace(/\\/g,'/')).split('/');
  if(!segs[0]||segs[0]==='..')return[];
  const out=[],magic=s=>/[*?[]/.test(s);
  async function walk(d,i,prefix,depth){
    if(out.length>=5000||depth>12)return;const s=segs[i],last=i===segs.length-1;
    if(s==='**'){if(!last)await walk(d,i+1,prefix,depth);
      for await(const[name,hd]of d.entries())if(hd.kind==='directory'&&!name.startsWith('.'))await walk(hd,i,prefix+name+'/',depth+1);return}
    if(!magic(s)){try{if(last){await d.getFileHandle(s);out.push(prefix+s)}else await walk(await d.getDirectoryHandle(s),i+1,prefix+s+'/',depth+1)}catch(e){}return}
    const re=globRegex(s);
    for await(const[name,hd]of d.entries()){if(!re.test(name)||(name.startsWith('.')&&!s.startsWith('.')))continue;
      if(last){if(hd.kind==='file')out.push(prefix+name)}else if(hd.kind==='directory')await walk(hd,i+1,prefix+name+'/',depth+1)}}
  try{await walk(F.root,0,'',0)}catch(e){}
  return out.map(p=>!base?p:p.startsWith(base)?p.slice(base.length):'../'+p);
}
async function newInputsNow(){ // step id -> files matching its patterns that it did not use
  const found=new Map(),byPattern=new Map();
  for(const s of S.steps.values()){if(!s||!Array.isArray(s.inputPatterns)||!Array.isArray(s.inputs))continue;
    const now=new Set();
    for(const p of s.inputPatterns){if(typeof p!=='string')continue;if(!byPattern.has(p))byPattern.set(p,await globFiles(p));byPattern.get(p).forEach(x=>now.add(normPath(x)))}

}

async function verifyChain(){

  if(!S.folder){if(S.fstate){S.fstate=null;S.newInputs=null;S.stale=new Set();render()}return}
  const refs=new Map();
  S.steps.forEach(s=>{if(s&&typeof s==='object')stepFiles(s).forEach(([,r])=>refs.set(refKey(r),r))});
  kifuFiles().forEach(r=>refs.set(refKey(r),r)); // the files the moves of kifu.json rest on

  S.checking=true;if(S.tab==='folder')renderPanel();

function shortNames(names){ // what differs between file names of one folder: "raw data_ch001-020.xlsx" -> "ch001-020"
  if(names.length<2)return names;
  const base=names.map(n=>n.replace(/\.[^.]+$/,''));let pre=base[0],suf=base[0];
  base.forEach(b=>{while(!b.startsWith(pre))pre=pre.slice(0,-1);while(!b.endsWith(suf))suf=suf.slice(1)});
  pre=pre.replace(/[^ _.-]*$/,'');suf=suf.replace(/^[^ _.-]*/,''); // cut at word boundaries
  const out=base.map(b=>b.slice(pre.length,b.length-suf.length));
  return pre.length+suf.length>=4&&out.every(x=>x.length)&&new Set(out).size===out.length?out:names;
}

   The user's own articles and reports go in habits/writing/. The page measures plain numbers in .md and .txt files;
   an agent reads all of them (also .docx and .pdf) and suggests rules in style/writingProposal. The user ticks the rules

function textStats(texts){ // sentence and paragraph lengths, lists and bold, in any language
  let sents=0,chars=0,paras=0,paraSents=0,items=0,lines=0,bold=0;
