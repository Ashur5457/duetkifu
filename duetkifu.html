    body.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).forEach(p=>{
      const ls=p.split('\n');lines+=ls.length;items+=ls.filter(l=>/^\s*([-*+]|\d+[.)])\s/.test(l)).length;
      const ss=p.replace(/^\s*([-*+]|\d+[.)]|#+)\s+/gm,'').split(/(?<=[.!?\u3002\uff01\uff1f])\s*/).map(s=>s.trim()).filter(s=>s.length>1);
      if(!/^#/.test(p)){paras++;paraSents+=ss.length}
      ss.forEach(s=>{sents++;chars+=[...s].length})})}
  return{files:texts.length,sentences:sents,avgSentence:sents?Math.round(chars/sents):0,avgParagraph:paras?Math.round(10*paraSents/paras)/10:0,listShare:lines?Math.round(100*items/lines):0,bold};

/* ---------- Ask the agent to revise ----------
   The page never calls an AI model. With the launcher, a request is a notice stored by duetkifu.py; an agent waiting
   with "duetkifu.py wait" picks it up, reads the annotations from report.json, and reports progress with
   "duetkifu.py agent-status", which the page shows here. Without a listening agent, the page offers a prompt to paste. */

    return waiting?{state:'sent',text:tr('Request sent. Waiting for the agent…')}:{state:'unanswered',text:tr('No agent has answered yet.'),cls:'bad'}}
  const note=st.note?' '+st.note:'';
  if(st.state==='working')return{state:'working',text:tr('The agent is revising the report…')+note};
  if(st.state==='failed')return{state:'failed',text:tr('The agent could not finish.')+note,cls:'bad'};
  const n=S.annos.filter(a=>a.status==='done'&&a.resolvedAt&&a.resolvedAt>=req.at).length;

/* ---------- Undo and redo: your own changes, newest first ----------
   Report: the changes of the current round (one record per block and field, as the Changes tab shows them); undoing one
   puts the field back, which removes its record. Kifu: every change since the last round; an undo is recorded too
   (undoOf), and a redo (redoOf), so the record keeps everything. The agent's changes are not undone here (Changes tab). */
const UNDO={redo:[],busy:false,undoing:false};
const KIFU_FIELD_NAMES={title:'Title','result.text':'Result, in words',why:'Why',note:'What it means',population:'Population',reason:'Why it ended',status:'Status',
  outcome:'Result',cause:'Cause',causeConfirmed:'Cause',parent:'Follows',links:'Links',mark:'Mark',milestone:'Milestone',kind:'Kind',pos:'Position on the Kifu diagram',
  add:'Added the move',delete:'Deleted the move'};
function kifuChangesList(){return Object.values((S.kifu&&S.kifu.data&&S.kifu.data.changes)||{}).filter(c=>c&&typeof c==='object')}
function undoCandidates(){
  const rep=currentChanges().filter(c=>c.by==='user'&&c.revertible!==false&&!c.undo).map(c=>({kind:'report',c}));
  const since=lastRoundAt(),all=kifuChangesList(),state=new Map();
  all.filter(c=>c.undoOf||c.redoOf).sort((a,b)=>(a.at||'')<(b.at||'')?-1:1).forEach(c=>state.set(c.undoOf||c.redoOf,c.undoOf?'undone':'redone'));
  const kf=all.filter(c=>c.by==='user'&&!c.undoOf&&!c.redoOf&&(c.at||'')>since&&state.get(c.id)!=='undone').map(c=>({kind:'kifu',c}));
  return[...rep,...kf].sort((a,b)=>(b.c.at||'')<(a.c.at||'')?-1:1)}
function undoLabel(x){const c=x.c;
  if(x.kind==='kifu'){const m=(S.kifu.data.moves||{})[c.move]||(c.before&&typeof c.before==='object'?c.before:null);
    const f=c.field.startsWith('evidence.')?'Data chain':c.field.startsWith('source.')?'Source':c.field.startsWith('kifu.meta.')?'Research question':KIFU_FIELD_NAMES[c.field.split('.')[0]==='result'?c.field:c.field.split('.')[0]];
    return(m?(m.title||c.move):c.move||'')+' · '+(f?tr(f):c.field)}
  return tr('{a}, {b}',{a:c.name||blockName(c.blockId),b:fieldLabel(c.field)})}
function kifuPut(d,c,mode,extra,snap){ // undo or redo kifu change c inside d; false when it cannot be done
  const remove=()=>{const m=d.moves[c.move];if(!m)return false;
    if(Object.values(d.moves).some(o=>o&&o!==m&&(o.parent===c.move||(Array.isArray(o.links)&&o.links.some(l=>l&&l.to===c.move))))){toast(tr('Other moves follow this one, so it cannot be taken back.'));return false}
    delete d.moves[c.move];kifuChange(d,c.move,'delete',m,null,extra);return true};
  const restore=m=>{if(!m||typeof m!=='object'||d.moves[c.move])return false;d.moves[c.move]=clone(m);kifuChange(d,c.move,'add',null,m.title||c.move,extra);return true};
  if(c.field==='add')return mode==='undo'?remove():restore(snap);
  if(c.field==='delete')return mode==='undo'?restore(c.before):remove();
  const val=clone(mode==='undo'?c.before:c.after);
  if(c.field.startsWith('kifu.meta.')){const f=c.field.slice(10);if(!d.kifu||typeof d.kifu!=='object')d.kifu={};if(!d.kifu.meta||typeof d.kifu.meta!=='object')d.kifu.meta={};
    const cur=d.kifu.meta[f];if(val==null||val==='')delete d.kifu.meta[f];else d.kifu.meta[f]=val;kifuChange(d,c.move,c.field,cur,val,extra);return true}
  const m=d.moves[c.move];if(!m)return false;const cur=getPath(m,c.field);setMoveField(m,c.field,val);kifuChange(d,c.move,c.field,cur,val,extra);return true}
async function undoLast(){
  if(!editingMode()||UNDO.busy)return;const x=undoCandidates()[0];if(!x){toast(tr('Nothing to undo'));return}
  UNDO.busy=UNDO.undoing=true;
  try{if(x.kind==='report'){if(x.c.field==='add'){x.snap=clone(S.blocks.get(x.c.blockId)||null);x.index=orderedBlocks().findIndex(b=>b.id===x.c.blockId)} // kept here for Redo
      await revertChange(x.c)}
    else{const c=x.c;x.snap=c.field==='add'?clone((S.kifu.data.moves||{})[c.move]||null):null; // a move taken back is kept here for Redo
      const ok=await kifuWrite(d=>kifuPut(d,c,'undo',{undoOf:c.id}));if(!ok)return}
    UNDO.redo.push(x);toast(tr('Undone: {what}',{what:undoLabel(x)}))}
  finally{UNDO.busy=UNDO.undoing=false;render()}}
async function redoLast(){
  if(!editingMode()||UNDO.busy)return;const x=UNDO.redo.pop();if(!x){toast(tr('Nothing to redo'));return}
  UNDO.busy=true;

    if(x.kind==='report'){
      if(c.field==='add'){const b=x.snap;if(b&&!S.blocks.has(b.id)){S.blocks.set(b.id,b);const o=orderedBlocks().map(y=>y.id).filter(y=>y!==b.id);
          o.splice(clamp(x.index<0?o.length:x.index,0,o.length),0,b.id);S.meta={...S.meta,order:o};render();
          await put('blocks/'+b.id,b);await put('report/meta',S.meta);await recordChange({blockId:b.id,field:'add',before:null,after:typeName(b.type),name:c.name})}}
      else if(c.field==='delete')await removeBlock(c.blockId);
      else if(c.field==='order')await saveOrder(c.after);
      else if(c.field.startsWith('style.'))await saveStyle(setPath(clone(styleNow()),c.field.slice(6),clone(c.after)));
      else{const b=S.blocks.get(c.blockId);if(b)await saveBlock(setPath(clone(b),c.field,clone(c.after)))}}
    else if(!await kifuWrite(d=>kifuPut(d,c,'redo',{redoOf:c.id},x.snap))){UNDO.redo.push(x);return}
    toast(tr('Redone: {what}',{what:undoLabel(x)}))}
  finally{UNDO.busy=false;render()}}

  db.collection('blocks').limit(500).onSnapshot(s=>{S.blocks=new Map(s.docs.map(d=>[d.id,d.data()]).filter(x=>x[1]));render()},fail);
  db.collection('datasets').limit(500).onSnapshot(s=>{S.datasets=new Map(s.docs.map(d=>[d.id,d.data()]).filter(x=>x[1]));scheduleVerify();render()},fail);
  db.collection('annotations').limit(1000).onSnapshot(s=>{S.annos=s.docs.map(d=>d.data()).filter(a=>a&&a.id);quiet(()=>{renderPanel();paintAllOverlays()})},fail);
  db.collection('changes').limit(1000).onSnapshot(s=>{S.changes=s.docs.map(d=>d.data()).filter(c=>c&&c.id);renderPanel()},fail);
  db.collection('rounds').limit(500).onSnapshot(s=>{S.rounds=s.docs.map(d=>d.data()).filter(r=>r&&r.id);renderPanel()},fail);
  db.collection('steps').limit(1000).onSnapshot(s=>{S.steps=new Map(s.docs.map(d=>[d.id,d.data()]).filter(x=>x[1]&&typeof x[1]==='object'));scheduleVerify();render()},fail);
  db.doc('style/profile').onSnapshot(s=>{S.style=s.exists?s.data():null;render()},fail);
  db.collection('examples').limit(200).onSnapshot(s=>{S.examples=s.docs.map(d=>d.data()).filter(x=>x&&x.id);renderPanel()},fail);
  db.doc('style/writing').onSnapshot(s=>{S.writing=s.exists?s.data():null;renderPanel()},fail); // the writing habits the user confirmed
  db.doc('style/writingProposal').onSnapshot(s=>{const d=s.exists?s.data():null; // written by an agent, confirmed by the user in Folder > Habits
    const rules=d&&Array.isArray(d.rules)?d.rules.filter(r=>r&&typeof r.text==='string'&&r.text.trim()&&r.text.length<600)
      .map(r=>({text:r.text.trim(),from:r.from?String(r.from):'',conf:typeof r.conf==='number'?r.conf:null,on:(r.conf??1)>=0.6})):[];
    S.writingProposal=rules.length?{rules,note:d.note?String(d.note):'',source:'agent'}:(S.writingProposal&&S.writingProposal.source!=='agent'?S.writingProposal:null);renderPanel()},fail);
  db.doc('style/proposal').onSnapshot(s=>{const d=s.exists?s.data():null; // written by an agent, confirmed by the user in the Style tab
    const rows=d&&Array.isArray(d.rows)?d.rows.filter(r=>r&&STYLE_FIELDS.includes(r.field)&&validStyleValue(r.field,r.value)).map(r=>({field:r.field,value:r.value,conf:r.conf,from:r.from?String(r.from):'',source:'agent',on:(r.conf??1)>=0.6})):[];
    S.agentProposal=rows.length?{rows,note:d.note?String(d.note):''}:null;renderPanel()},fail);
}
function showNote(t,acts,ok){const n=$('#note-db');$('#note-text').textContent=t||'';$('#note-acts').replaceChildren(...(acts||[]));n.hidden=!t;n.classList.toggle('saved',!!ok)}
async function start(){
  const emb=document.getElementById('duetkifu-embedded');
  if(emb){S.readonly=true;document.body.classList.add('readonly');setMode('view'); // a read-only copy: the report is inside this file
    try{db=memDB(readReport(emb.textContent,tr('This file')))}catch(e){fail(e&&e.msg||tr('This is not a Duetkifu report file.'),e&&e.detail);return}
    subscribe();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);return}
  setMode('view');
  let cloud=null;try{cloud=(window.claude&&window.claude.use)?await window.claude.use('db'):null}catch(e){cloud=null}
  if(cloud){db=cloud;S.cloud=true}else db=memDB();
  try{await seedIfEmpty()}catch(e){if(S.cloud){S.initError=tr('Failed to initialise cloud data (')+((e&&e.code)||tr('unknown'))+tr('). Showing local mode.');logIssue('error',S.initError,errText(e));db=memDB();S.cloud=false;await seedIfEmpty()}}
  subscribe();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
  if(S.cloud){const tryUse=async n=>{try{return await window.claude.use(n)}catch(e){return null}};
    const[a,sm,dl]=await Promise.all(['assets','sample','downloads'].map(tryUse));S.caps={assets:a,sample:sm,downloads:dl};render()}
  else if(!await connectServer()){renderLocalBar();restoreFolder()}
  welcomeOnce();
}
$('#lang').addEventListener('change',e=>{const v=e.target.value;if(v==='__add'){e.target.value=LANG;openLangDialog();return}if(v!==LANG)switchLang(v)});
$('#langfile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;
  try{if(f.size>1e6)throw{};const text=await f.text(),r=importLang(JSON.parse(text));closeModal();switchLang(r.code);
    if(S.folder)subdir(S.folder.dir,'lang',true).then(d=>d&&writeFile(d,r.code+'.json',text)).catch(()=>{});
    toast(tr('Loaded {name}: {n} sentences',{name:r.name,n:r.n})+(r.bad?tr(' ({b} skipped: placeholders do not match)',{b:r.bad}):''))}
  catch(err){fail(err&&err.msg?err.msg:tr('This is not a valid Duetkifu translation file.'),err)}});
collectStatic();applyStatic();
start();
})();
</script>
